version: ~> 1.0

language: r
r:
  - "4.3"
dist: focal
r_bioc_packages:
  - BiocManager
  - GenomicRanges
  - Gviz
  - orthogene
r_packages:
  - tidyverse
  - yaml
  - httr2
  - ragg
  - xml2
  - fs
  - withr
  - knitr
  - rmarkdown
  - testthat
  - R.rsp
  - roxygen2
  - pkgdown
  - rcmdcheck
  - rversions
  - urlchecker
  - usethis
  - devtools

# Install system dependencies using centralized script
before_install:
  - sudo apt-get update
  - sudo apt-get install -y jq
  - bash .scripts/install_dependencies.sh all-except-r
  # - bash .scripts/wait_for_github_actions.sh

branches:
  only:
    - develop
    - master

pull_request:
  branches:
    - master
    - develop 

notifications:
  email: false

script:
  - bash .scripts/R_build_travis.sh
  - echo "Hello $TRAVIS_BRANCH"
after_success:
  - cd $TRAVIS_BUILD_DIR
  - if [ "${TRAVIS_BRANCH}" = "develop" ]; then bash .scripts/R_doc.sh --token "$robqbot_TOKEN" --email "$robqbot_EMAIL" --name "$robqbot_NAME" --jekyll-folder "$jekyllFolder" --source-branch "develop"; fi
after_failure:
  - cd $TRAVIS_BUILD_DIR
  - if [ "${TRAVIS_BRANCH}" = "develop" ]; then bash .scripts/R_debug_travis.sh --token "$robqbot_TOKEN" --email "$robqbot_EMAIL" --name "$robqbot_NAME" --source-branch "develop"; fi
cache:
  directories:
    - "$HOME/R/Library"
    - "$HOME/packrat/src"
    - "$HOME/packrat/lib"
  packages: true
  timeout: 1000
env:
  global:
  - orgName=DPP4ResearchGroup packageName=SyntenyViz jekyllFolder=jekyll_collection 
  - secure: 
  - secure: 

## deployment of compiled vignettes to gh-pages
deploy:
  provider: script
  skip_cleanup: true
  on:
    branch: master
    ## branch: develop
  script:
    - bash .scripts/Jekyll_content_deploy.sh
