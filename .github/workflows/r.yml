          echo "🔝 TOP MEM: $(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        debug_start_time=$(date +%s)
        
        echo "📊 Pre-comprehensive debug resource status:"
        metrics "PRE-COMPREHENSIVE-DEBUG"
        
        echo "🔍 Running comprehensive debug analysis..."
        
        # Check build artifacts
        echo "📋 Build artifacts analysis:"
        echo "Current directory: $(pwd)"
        echo "Contents:"
        ls -la
        
        # Check if man directory exists and has content
        if [ -d "man" ]; then
          echo "📚 Man directory exists with $(ls man/ | wc -l) files"
          echo "Man files:"
          ls -la man/ | head -10
        else
          echo "❌ Man directory not found"
        fi
        
        # Check vignettes
        if [ -d "vignettes" ]; then
          echo "📖 Vignettes directory exists"
          echo "Vignette files:"
          find vignettes -type f | head -10
          echo "Built vignettes (HTML):"
          find vignettes -name "*.html" | head -10
        else
          echo "❌ Vignettes directory not found"
        fi
        
        # Check for package tarball
        echo "📦 Package tarballs:"
        find . -name "SyntenyViz_*.tar.gz" -type f
        
        # Check R check results
        if [ -d "SyntenyViz.Rcheck" ]; then
          echo "🔍 R check results found:"
          ls -la SyntenyViz.Rcheck/
          if [ -f "SyntenyViz.Rcheck/00check.log" ]; then
