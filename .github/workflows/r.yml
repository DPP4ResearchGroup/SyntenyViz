name: R-CI-Optimized

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  pull-requests: write
  contents: write

env:
  R_REPOS: 'https://cloud.r-project.org'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.5', 'latest']
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-${{ matrix.r-version }}
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Cache R packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: r-${{ matrix.r-version }}-

    - name: Setup environment
      run: |
        source .scripts/workflow_helpers.sh
        validate_description
        install_system_deps
        setup_r_environment

    - name: Install R packages
      run: |
        source .scripts/workflow_helpers.sh
        
        # Define all packages with types
        packages=(
          "devtools:cran"
          "knitr:cran" 
          "rmarkdown:cran"
          "testthat:cran"
          "usethis:cran"
          "yaml:cran"
          "stringr:cran"
          "dplyr:cran"
          "BiocManager:cran"
          "R.rsp:cran"
          "GenomicRanges:bioc"
          "Gviz:bioc"
          "ggtree:bioc"
          "orthogene:bioc"
        )
        
        install_package_batch "${packages[@]}"

    - name: Build package
      if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
      run: |
        source .scripts/workflow_helpers.sh
        build_package
        verify_package

    - name: Upload artifacts
      if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: syntenyviz-r${{ matrix.r-version }}-package
        path: |
          SyntenyViz_*.tar.gz
          man/
          vignettes/*.html
        retention-days: 30

    - name: Deploy documentation
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
      env:
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_NAME: "robqbot"
      run: |
        source .scripts/workflow_helpers.sh
        
        if [ -z "$robqbot_TOKEN" ]; then
          echo "⚠️ Deployment token not available - skipping deploy"
          exit 0
        fi
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        monitor_step "Deploying documentation"
        bash .scripts/Jekyll_content_deploy.sh \
          --token "$robqbot_TOKEN" \
          --email "$robqbot_EMAIL" \
          --name "$robqbot_NAME" \
          --jekyll-folder "static_files" \
          --source-branch "develop"

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ${{ job.status == 'success' && '✅ **Build Successful**' || '❌ **Build Failed**' }}
          
          **Branch:** `${{ github.head_ref }}`
          **R Version:** `${{ matrix.r-version }}`
          ${{ job.status == 'success' && '**Status:** All checks passed, package built successfully' || format('**Status:** Build failed - [View logs]({0}/{1}/actions/runs/{2})', github.server_url, github.repository, github.run_id) }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
