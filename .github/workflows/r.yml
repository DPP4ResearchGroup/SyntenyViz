  deploy:
    needs: [setup-dependencies, build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      # Use latest R version for deployment (most compatible)
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-latest
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up R latest
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: latest

    - name: Restore R packages cache for latest version
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-latest-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-latest-packages-

    - name: Restore Build Cache
      id: cache-restore
      uses: actions/cache@v4
      with:
        path: |
          SyntenyViz_*.tar.gz
          man/
          vignettes/
        key: build-artifacts-${{ github.sha }}-rlatest
        restore-keys: |
          build-artifacts-${{ github.ref_name }}-rlatest-
          build-artifacts-rlatest-

    - name: Debug Cache Status
      run: |
        echo "🔍 Cache restore status:"
        echo "  Cache hit: ${{ steps.cache-restore.outputs.cache-hit }}"
        echo "  Cache key: build-artifacts-${{ github.sha }}-rlatest"
        echo "  Restore keys: build-artifacts-${{ github.ref_name }}-rlatest-, build-artifacts-rlatest-"
        echo ""
        echo "📁 Checking for cached artifacts:"
        if [ -f "SyntenyViz_*.tar.gz" ] || find . -name "SyntenyViz_*.tar.gz" -type f | head -1; then
          echo "✅ Package tarball found in cache"
          find . -name "SyntenyViz_*.tar.gz" -type f
        else
          echo "❌ No package tarball found in cache"
        fi
        
        if [ -d "man" ] && [ "$(ls -A man/ 2>/dev/null)" ]; then
          echo "✅ Man pages found in cache: $(ls man/ | wc -l) files"
        else
          echo "❌ No man pages found in cache"
        fi
        
        if [ -d "vignettes" ] && [ "$(ls -A vignettes/ 2>/dev/null)" ]; then
          echo "✅ Vignettes found in cache: $(find vignettes -type f | wc -l) files"
        else
          echo "❌ No vignettes found in cache"
        fi

    - name: Install R Latest and Package
      run: |
        set -euxo pipefail
        
        echo "🚀 Setting up R environment and installing package..."
        
        # Set up R environment for latest version
        export R_LIBS_USER=${{ github.workspace }}/Rlibs-latest
        export R_LIBS_SITE=${{ github.workspace }}/Rlibs-site-latest
        mkdir -p "$R_LIBS_USER" "$R_LIBS_SITE"
        
        # R installation is now handled by r-lib/actions/setup-r action above
        # Install system dependencies
        echo "🔧 Installing system dependencies..."
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        
        # Verify R installation
        if ! command -v R >/dev/null 2>&1; then
          echo "❌ ERROR: R latest is not installed or not in PATH"
          exit 1
        fi
        echo "✅ R latest installed: $(R --version | head -1)"
        
        # Check if build artifacts are available from cache
        PACKAGE_TARBALL=$(find . -name "SyntenyViz_*.tar.gz" | head -1)
        if [ -n "$PACKAGE_TARBALL" ]; then
          echo "📦 Installing SyntenyViz package from cached tarball..."
          R CMD INSTALL "$PACKAGE_TARBALL" --library="$R_LIBS_USER"
          echo "✅ Package installed successfully from cache"
        else
          echo "⚠️  No cached package tarball found, will build from source"
          # Fallback: build from source
          bash .scripts/R_build.sh
          
          # Install the newly built package
          PACKAGE_TARBALL=$(find . -name "SyntenyViz_*.tar.gz" | head -1)
          if [ -n "$PACKAGE_TARBALL" ]; then
            echo "📦 Installing newly built SyntenyViz package..."
            R CMD INSTALL "$PACKAGE_TARBALL" --library="$R_LIBS_USER"
            echo "✅ Package installed successfully from fresh build"
          fi
        fi
        
        # Verify package installation
        if Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); library(SyntenyViz)" 2>/dev/null; then
          echo "✅ SyntenyViz package verified and ready for deployment"
        else
          echo "❌ SyntenyViz package verification failed"
          exit 1
        fi

