            echo "⚠️  Potential YAML issue in $vignette - no opening --- found"
          fi
        done
        
        # Check for R syntax issues in vignettes
        echo "🔍 Checking for R syntax issues:"
        for vignette in $(find vignettes -name "*.Rmd" 2>/dev/null); do
          if grep -q "```{r" "$vignette"; then
            echo "📋 Found R chunks in $vignette"
