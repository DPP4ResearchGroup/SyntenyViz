          DEBUG_CONTENT+="\`\`\`\n\n"
        fi
        
        # Add performance metrics if available
        if [ -f "/tmp/performance_metrics.txt" ]; then
          DEBUG_CONTENT+="## Performance Metrics\n\n"
          DEBUG_CONTENT+="\`\`\`\n"
          DEBUG_CONTENT+="$(cat /tmp/performance_metrics.txt)\n"
          DEBUG_CONTENT+="\`\`\`\n\n"
        fi
        
        # Add system information
        DEBUG_CONTENT+="## System Information\n\n"
        DEBUG_CONTENT+="**Hostname:** $(hostname)\n"
        DEBUG_CONTENT+="**OS:** $(uname -a)\n"
        DEBUG_CONTENT+="**Current Directory:** $(pwd)\n"
        DEBUG_CONTENT+="**Disk Usage:**\n"
        DEBUG_CONTENT+="\`\`\`\n"
        DEBUG_CONTENT+="$(df -h)\n"
        DEBUG_CONTENT+="\`\`\`\n\n"
        
        # Add R environment
        DEBUG_CONTENT+="## R Environment\n\n"
        if command -v R >/dev/null 2>&1; then
          DEBUG_CONTENT+="**R Version:**\n"
          DEBUG_CONTENT+="\`\`\`\n"
          DEBUG_CONTENT+="$(R --version)\n"
          DEBUG_CONTENT+="\`\`\`\n\n"
        else
          DEBUG_CONTENT+="❌ R not found\n\n"
        fi
        
        # Add package status
        DEBUG_CONTENT+="## Package Status\n\n"
        if [ -f "DESCRIPTION" ]; then
          DEBUG_CONTENT+="**DESCRIPTION file:**\n"
          DEBUG_CONTENT+="\`\`\`\n"
          DEBUG_CONTENT+="$(head -20 DESCRIPTION)\n"
          DEBUG_CONTENT+="\`\`\`\n\n"
        else
          DEBUG_CONTENT+="❌ DESCRIPTION file not found\n\n"
        fi
        
        # Add vignette analysis
        DEBUG_CONTENT+="## Vignette Analysis\n\n"
        if [ -d "vignettes" ]; then
          DEBUG_CONTENT+="**Vignette files:**\n"
          DEBUG_CONTENT+="\`\`\`\n"
          DEBUG_CONTENT+="$(find vignettes -name "*.Rmd" -exec basename {} \;)\n"
          DEBUG_CONTENT+="\`\`\`\n\n"
          
          # Check for theme conflicts
          theme_files_debug=$(find vignettes -name "*.Rmd" -exec grep -l "theme:" {} \; 2>/dev/null)
          if [ -n "$theme_files_debug" ]; then
            DEBUG_CONTENT+="⚠️ **Theme conflicts detected:**\n"
            echo "$theme_files_debug" | while read -r file; do
              DEBUG_CONTENT+="- $file\n"
            done
            DEBUG_CONTENT+="\n"
          else
            DEBUG_CONTENT+="✅ No theme conflicts found\n\n"
          fi
        else
          DEBUG_CONTENT+="❌ Vignettes directory not found\n\n"
        fi
        
        # Create Gist
        GIST_TITLE="SyntenyViz Build Failure Debug - Run ${{ github.run_number }}"
        GIST_FILENAME="build-failure-debug-${{ github.run_number }}.md"
        
        # Create the Gist using GitHub API
        GIST_RESPONSE=$(curl -s -X POST \
          -H "Authorization: token ${robqbot_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/gists \
          -d "{
            \"description\": \"$GIST_TITLE\",
            \"public\": false,
            \"files\": {
              \"$GIST_FILENAME\": {
                \"content\": \"$DEBUG_CONTENT\"
              }
            }
          }")
        
        # Extract Gist URL
        GIST_URL=$(echo "$GIST_RESPONSE" | grep -o '"html_url": "[^"]*"' | cut -d'"' -f4)
        
        if [ -n "$GIST_URL" ]; then
          echo "✅ Debug Gist created successfully: $GIST_URL"
          echo "GIST_URL=$GIST_URL" >> $GITHUB_ENV
          
          # Clean up old debug Gists (keep last 10)
          echo "🧹 Cleaning up old debug Gists..."
          OLD_GISTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists?per_page=100" | \
            jq -r '.[] | select(.description | contains("SyntenyViz Build Failure Debug")) | .id' | \
            tail -n +11)
          
          for gist_id in $OLD_GISTS; do
            echo "Deleting old debug Gist: $gist_id"
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/gists/$gist_id" || true
          done
        else
          echo "❌ Failed to create debug Gist"
          echo "Response: $GIST_RESPONSE"
          echo "GIST_URL=" >> $GITHUB_ENV
        fi

    - name: Add PR Comment - Success
      if: github.event_name == 'pull_request' && success()
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ✅ **Comprehensive Build Successful** 
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          
          **Job Status:**
