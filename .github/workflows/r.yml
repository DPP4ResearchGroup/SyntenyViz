name: R-CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.4', 'latest']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Resource usage metrics (after checkout)
      if: always()
      run: |
        echo "=== Resource usage (post-checkout) ==="; date
        echo "Uptime:"; uptime
        echo "CPU info:"; nproc; lscpu | egrep 'Model name|CPU\(s\)|Thread|Core|Socket|MHz' || true
        echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true)
        echo "Disk:"; df -h
        echo "Top by MEM:"; ps -eo pid,comm,%cpu,%mem --sort=-%mem | head -n 10
        echo "Top by CPU:"; ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 10

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Resource usage metrics (after setup-r)
      if: always()
      run: |
        echo "=== Resource usage (post-setup-r) ==="; date
        uptime; free -h || true; df -h

    - name: Set up R dependencies (pak)
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        use-public-rspm: true
        extra-packages: |
          any::devtools
          any::BiocManager
          any::knitr
          any::rmarkdown
          any::testthat
          any::usethis
          any::yaml
          any::stringr
          any::dplyr
          any::rlist
          bioc::GenomicRanges
          bioc::Gviz
          bioc::orthogene
        update: false

    - name: Resource usage metrics (after setup-r-dependencies)
      if: always()
      run: |
        echo "=== Resource usage (post-setup-r-dependencies) ==="; date
        uptime; free -h || true; df -h

    - name: Cache all R packages and system dependencies
      uses: actions/cache@v3
      with:
        path: |
          ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-r-${{ matrix.r-version }}-all-deps-${{ hashFiles('**/DESCRIPTION') }}-${{ hashFiles('**/NAMESPACE') }}
        restore-keys: |
          ${{ runner.os }}-r-${{ matrix.r-version }}-all-deps-${{ hashFiles('**/DESCRIPTION') }}-
          ${{ runner.os }}-r-${{ matrix.r-version }}-all-deps-

    - name: Install system dependencies
      run: |
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "CPU:"; nproc; lscpu | egrep 'Model name|CPU\(s\)|Thread|Core|Socket|MHz' || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
          echo "Top by MEM:"; ps -eo pid,comm,%cpu,%mem --sort=-%mem | head -n 10;
          echo "Top by CPU:"; ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 10;
        }
        echo "Installing system dependencies..."; metrics
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libnlopt-dev
        echo "✅ System dependencies installed successfully!"; metrics

    - name: Resource usage metrics (after system deps)
      if: always()
      run: |
        echo "=== Resource usage (post-system-deps) ==="; date
        uptime; free -h || true; df -h

    - name: Install and verify R packages
      run: |
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        # Function to check package availability with better error handling
        check_package() {
          local pkg=$1
          local result
          result=$(Rscript -e "requireNamespace('$pkg', quietly = TRUE)" 2>&1)
          if [ $? -eq 0 ]; then
            echo "✅ Package '$pkg' is available"
            return 0
          else
            echo "❌ Package '$pkg' is NOT available: $result"
            return 1
          fi
        }
        
        # Function to install CRAN package with error handling
        install_cran_package() {
          local pkg=$1
          echo "Installing CRAN package: $pkg"
          local result
          result=$(Rscript -e "install.packages('$pkg', repos = 'https://cloud.r-project.org')" 2>&1)
          if [ $? -eq 0 ]; then
            echo "✅ Successfully installed CRAN package: $pkg"
            return 0
          else
            echo "❌ Failed to install CRAN package: $pkg"
            echo "Error: $result"
            return 1
          fi
        }
        
        # Install CRAN packages if not available
        echo "=== Installing CRAN packages ==="
        cran_packages=("devtools" "knitr" "rmarkdown" "testthat" "usethis")
        cran_install_needed=false
        
        for pkg in "${cran_packages[@]}"; do
          if ! check_package "$pkg"; then
            cran_install_needed=true
            break
          fi
        done
        
        if [ "$cran_install_needed" = true ]; then
          echo "Installing CRAN packages..."
          for pkg in "${cran_packages[@]}"; do
            if ! check_package "$pkg"; then
              if ! install_cran_package "$pkg"; then
                echo "❌ Critical: Failed to install CRAN package: $pkg"
                exit 1
              fi
            fi
          done
        else
          echo "✅ All CRAN packages available from cache"
        fi
        
        # Install Bioconductor packages if not available
        echo "=== Installing Bioconductor packages ==="
        if ! check_package "GenomicRanges"; then
          echo "Installing Bioconductor packages..."
          
          # Install BiocManager first if needed
          if ! check_package "BiocManager"; then
            echo "Installing BiocManager..."
            if ! install_cran_package "BiocManager"; then
              echo "❌ Critical: Failed to install BiocManager"
              exit 1
            fi
          fi
          
          # Install Bioconductor packages
          echo "Installing Bioconductor packages via BiocManager..."
          local result
          result=$(Rscript -e 'BiocManager::install(c("GenomicRanges", "Gviz", "orthogene"), ask = FALSE, update = FALSE)' 2>&1)
          if [ $? -eq 0 ]; then
            echo "✅ Successfully installed Bioconductor packages"
          else
            echo "❌ Failed to install Bioconductor packages"
            echo "Error: $result"
            exit 1
          fi
        else
          echo "✅ Bioconductor packages available from cache"
        fi
        
        # Install package dependencies if not available
        echo "=== Installing package dependencies ==="
        if ! check_package "dplyr"; then
          echo "Installing package dependencies via devtools..."
          local result
          result=$(Rscript -e 'library(devtools); install_deps(dependencies = TRUE, upgrade = "never")' 2>&1)
          if [ $? -eq 0 ]; then
            echo "✅ Successfully installed package dependencies"
          else
            echo "❌ Failed to install package dependencies"
            echo "Error: $result"
            exit 1
          fi
        else
          echo "✅ Package dependencies available from cache"
        fi
        
        # Verify all critical packages are available
        echo "=== Verifying package availability ==="
        required_pkgs=("devtools" "GenomicRanges" "Gviz" "dplyr" "stringr" "grid" "yaml" "rlist")
        missing_pkgs=()
        
        for pkg in "${required_pkgs[@]}"; do
          if ! check_package "$pkg"; then
            missing_pkgs+=("$pkg")
          fi
        done
        
        if [ ${#missing_pkgs[@]} -gt 0 ]; then
          echo "❌ Critical: Missing packages: ${missing_pkgs[*]}"
          echo "Attempting to install missing packages..."
          
          for pkg in "${missing_pkgs[@]}"; do
            if ! check_package "$pkg"; then
              echo "❌ Critical: Package '$pkg' still not available after installation attempts"
              exit 1
            fi
          done
        fi
        
        echo "✅ All required packages are available"
        
        # Show environment information for debugging
        echo "=== Environment information ==="
        echo "R_LIBS_USER: $R_LIBS_USER"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        echo "Current directory: $(pwd)"
        echo "R version: $(Rscript -e 'cat(R.version.string)')"
        
        echo "✅ All R packages installed and verified successfully!"; metrics

    - name: Resource usage metrics (after R package install)
      if: always()
      run: |
        echo "=== Resource usage (post-R-packages) ==="; date
        uptime; free -h || true; df -h

    - name: Run build script on develop branch
      if: github.ref == 'refs/heads/develop'
      run: |
        set -euxo pipefail
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        echo "Starting build process..."
        echo "Current directory: $(pwd)"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        echo "Contents of current directory:"
        ls -la
        echo "Contents of .scripts directory:"
        ls -la .scripts/ || true
        echo "Package DESCRIPTION file:"
        test -f DESCRIPTION && cat DESCRIPTION || echo "DESCRIPTION not found"
        echo "Package NAMESPACE file:"
        test -f NAMESPACE && cat NAMESPACE || echo "NAMESPACE not found"
        echo "Running build script..."
        if [ -x .scripts/R_build.sh ]; then
          bash -x .scripts/R_build.sh
        elif [ -f .scripts/R_build.sh ]; then
          bash -x .scripts/R_build.sh
        else
          echo ".scripts/R_build.sh not found" >&2
          exit 127
        fi
        metrics

    - name: Resource usage metrics (after build script)
      if: github.ref == 'refs/heads/develop' && always()
      run: |
        echo "=== Resource usage (post-build) ==="; date
        uptime; free -h || true; df -h

    - name: Print branch information
      run: |
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        echo "Event: ${{ github.event_name }}"
        echo "ref: ${{ github.ref }}"
        echo "ref_name: ${{ github.ref_name }}"
        echo "head_ref (PR only): ${{ github.head_ref }}"
        echo "base_ref (PR only): ${{ github.base_ref }}"
        echo "Current commit SHA: ${{ github.sha }}"
        metrics

    - name: Run documentation script on develop branch
      if: github.ref == 'refs/heads/develop'
      run: |
        set -euxo pipefail
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        if [ -x .scripts/R_doc.sh ]; then
          bash -x .scripts/R_doc.sh
        elif [ -f .scripts/R_doc.sh ]; then
          bash -x .scripts/R_doc.sh
        else
          echo ".scripts/R_doc.sh not found" >&2
          exit 127
        fi
        metrics

    - name: Resource usage metrics (after docs)
      if: github.ref == 'refs/heads/develop' && always()
      run: |
        echo "=== Resource usage (post-docs) ==="; date
        uptime; free -h || true; df -h

    - name: Run debug script on failure
      if: failure() && github.ref == 'refs/heads/develop'
      run: |
        bash .scripts/R_debug.sh

    - name: Add PR Comment - Success
      if: github.event_name == 'pull_request' && success()
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ✅ **Build Successful** 
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          
          All R package dependencies installed successfully and build completed.
          
          **Cache Status:**
          - All packages and system dependencies: ✅ Cached
          
          **Next Steps:** Ready for review and testing.
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Add PR Comment - Failure
      if: github.event_name == 'pull_request' && failure()
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ❌ **Build Failed**
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          
          The build encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          
          **Common Issues to Check:**
          - R package dependencies
          - System library requirements
          - Cache corruption
          
          **Debug Info:** Debug script has been executed to help diagnose the issue.
        token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Resource usage metrics (deploy: after checkout)
      if: always()
      run: |
        echo "=== Resource usage (deploy post-checkout) ==="; date
        uptime; free -h || true; df -h

    - name: Print deploy git context
      run: |
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        echo "Event: ${{ github.event_name }}"
        echo "ref: ${{ github.ref }}"
        echo "ref_name: ${{ github.ref_name }}"
        echo "head_ref (PR only): ${{ github.head_ref }}"
        echo "base_ref (PR only): ${{ github.base_ref }}"
        echo "Current commit SHA: ${{ github.sha }}"
        echo "Current directory: $(pwd)"
        echo "Git version: $(git --version)"
        echo "Remote URL: $(git config --get remote.origin.url)"
        echo "Branch (symbolic): $(git branch --show-current || true)"
        echo "Branches:"
        git branch -a || true
        echo "Remotes:"
        git remote -v || true
        echo "Last commits:"
        git --no-pager log --oneline -n 5 || true
        echo "Scripts directory contents:"
        ls -la .scripts || true
        echo "Top of Jekyll_deploy.sh:"
        head -n 80 .scripts/Jekyll_deploy.sh || true
        metrics

    - name: Configure Git user
      run: |
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        metrics

    - name: Resource usage metrics (deploy: after git config)
      if: always()
      run: |
        echo "=== Resource usage (deploy post-git-config) ==="; date
        uptime; free -h || true; df -h

    - name: Deploy compiled vignettes to gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TRACE: '1'
        GIT_CURL_VERBOSE: '1'
      run: |
        set -euxo pipefail
        metrics() {
          echo "=== Resource usage: $(date) ===";
          echo "Uptime:"; uptime || true;
          echo "Memory:"; free -h || (grep -E 'Mem|Swap' /proc/meminfo || true);
          echo "Disk:"; df -h;
        }
        metrics
        echo "Git status before deploy:";
        git status || true
        echo "Current origin configuration:";
        git remote -v || true
        echo "Running deploy script with trace..."
        bash -x .scripts/Jekyll_deploy.sh
        echo "Git status after deploy:";
        git status || true
        metrics

    - name: Resource usage metrics (deploy: after deploy)
      if: always()
      run: |
        echo "=== Resource usage (deploy post-deploy) ==="; date
        uptime; free -h || true; df -h
