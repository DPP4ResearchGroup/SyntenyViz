          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        debug_start_time=$(date +%s)
        
        echo "📊 Pre-debug resource status:"
        metrics "PRE-DEBUG"
        
        bash .scripts/R_debug.sh
        
        # Calculate step duration
        debug_end_time=$(date +%s)
        debug_duration=$((debug_end_time - debug_start_time))
        
        echo "📊 Post-debug resource status:"
        metrics "POST-DEBUG"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Debug Duration: ${debug_duration} seconds"
        echo "  Start Time: $(date -d @$debug_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Add PR Comment - Success
      if: github.event_name == 'pull_request' && success()
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ✅ **Build Successful** 
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          
          **Job Status:**
          - ✅ Dependencies setup completed
          - ✅ Build completed successfully
          
          **Cache Status:**
          - R packages: ✅ Cached
          - System dependencies: ✅ Cached
          
          **Next Steps:** Ready for review and testing.
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Add PR Comment - Failure
      if: github.event_name == 'pull_request' && failure()
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ❌ **Build Failed**
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          
          The build encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          
          **Job Status:**
          - Dependencies setup: Check logs for status
          - Build: ❌ Failed
          
          **Common Issues to Check:**
          - R package dependencies
          - System library requirements
          - Cache corruption
          
          **Debug Info:** Debug script has been executed to help diagnose the issue.
        github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [setup-dependencies, build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}


    - name: Print deploy git context
      run: |
        # Resource monitoring function for individual steps
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          echo "=========================================="
          echo "📊 RESOURCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')%"
          
          # Memory Performance
          if command -v free >/dev/null 2>&1; then
            local mem_usage=$(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')
            local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f%%", $3/$2 * 100.0; else print "0%"}')
            echo "💾 MEMORY: ${mem_usage} | SWAP: ${swap_usage}"
          fi
          
          # Disk Performance
          echo "💿 DISK: $(df / | tail -1 | awk '{print $5}' || echo 'N/A')"
          
          # Process Performance
          echo "⚡ PROCESSES: $(ps aux | wc -l) total | $(ps aux | grep -v grep | grep -c '^R') running"
          echo "🔝 TOP MEM: $(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        git_context_start_time=$(date +%s)
        
        echo "📊 Pre-git context resource status:"
        metrics "PRE-GIT-CONTEXT"
        
        echo "Event: ${{ github.event_name }}"
        echo "ref: ${{ github.ref }}"
        echo "ref_name: ${{ github.ref_name }}"
        echo "head_ref (PR only): ${{ github.head_ref }}"
        echo "base_ref (PR only): ${{ github.base_ref }}"
        echo "Current commit SHA: ${{ github.sha }}"
        echo "Current directory: $(pwd)"
        echo "Git version: $(git --version)"
        echo "Remote URL: $(git config --get remote.origin.url)"
        echo "Branch (symbolic): $(git branch --show-current || true)"
        echo "Branches:"
        git branch -a || true
        echo "Remotes:"
        git remote -v || true
        echo "Last commits:"
        git --no-pager log --oneline -n 5 || true
        echo "Scripts directory contents:"
        ls -la .scripts || true
        echo "Top of Jekyll_deploy.sh:"
        head -n 80 .scripts/Jekyll_deploy.sh || true
        
        # Calculate step duration
        git_context_end_time=$(date +%s)
        git_context_duration=$((git_context_end_time - git_context_start_time))
        
        echo "📊 Post-git context resource status:"
        metrics "POST-GIT-CONTEXT"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Git Context Duration: ${git_context_duration} seconds"
        echo "  Start Time: $(date -d @$git_context_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Configure Git user
      run: |
        # Resource monitoring function for individual steps
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          echo "=========================================="
          echo "📊 RESOURCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')%"
          
          # Memory Performance
          if command -v free >/dev/null 2>&1; then
            local mem_usage=$(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')
            local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f%%", $3/$2 * 100.0; else print "0%"}')
            echo "💾 MEMORY: ${mem_usage} | SWAP: ${swap_usage}"
          fi
          
          # Disk Performance
          echo "💿 DISK: $(df / | tail -1 | awk '{print $5}' || echo 'N/A')"
          
          # Process Performance
          echo "⚡ PROCESSES: $(ps aux | wc -l) total | $(ps aux | grep -v grep | grep -c '^R') running"
          echo "🔝 TOP MEM: $(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        git_config_start_time=$(date +%s)
        
        echo "📊 Pre-git config resource status:"
        metrics "PRE-GIT-CONFIG"
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Calculate step duration
        git_config_end_time=$(date +%s)
        git_config_duration=$((git_config_end_time - git_config_start_time))
        
        echo "📊 Post-git config resource status:"
        metrics "POST-GIT-CONFIG"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Git Config Duration: ${git_config_duration} seconds"
        echo "  Start Time: $(date -d @$git_config_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"


    - name: Deploy compiled vignettes to gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_TRACE: '1'
        GIT_CURL_VERBOSE: '1'
        TRAVIS_BUILD_DIR: ${{ github.workspace }}
        TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
        jekyllFolder: docs
        robqbot_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        robqbot_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        robqbot_NAME: "github-actions[bot]"
      run: |
        set -euxo pipefail
        
        # Resource monitoring function for individual steps
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          echo "=========================================="
          echo "📊 RESOURCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')%"
          
          # Memory Performance
          if command -v free >/dev/null 2>&1; then
            local mem_usage=$(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')
            local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f%%", $3/$2 * 100.0; else print "0%"}')
            echo "💾 MEMORY: ${mem_usage} | SWAP: ${swap_usage}"
          fi
          
          # Disk Performance
          echo "💿 DISK: $(df / | tail -1 | awk '{print $5}' || echo 'N/A')"
          
          # Process Performance
          echo "⚡ PROCESSES: $(ps aux | wc -l) total | $(ps aux | grep -v grep | grep -c '^R') running"
          echo "🔝 TOP MEM: $(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        deploy_start_time=$(date +%s)
        
        echo "📊 Pre-deploy resource status:"
        metrics "PRE-DEPLOY"
        
        # Validate required environment variables
        echo "🔍 Validating deploy destination variables..."
        
        # Check TRAVIS_BUILD_DIR (GitHub Actions equivalent)
        if [ -z "$TRAVIS_BUILD_DIR" ]; then
          echo "❌ ERROR: TRAVIS_BUILD_DIR is not set"
          exit 1
        fi
        echo "✅ TRAVIS_BUILD_DIR: $TRAVIS_BUILD_DIR"
        
        # Check TRAVIS_BUILD_NUMBER (GitHub Actions equivalent)
        if [ -z "$TRAVIS_BUILD_NUMBER" ]; then
          echo "❌ ERROR: TRAVIS_BUILD_NUMBER is not set"
          exit 1
        fi
        echo "✅ TRAVIS_BUILD_NUMBER: $TRAVIS_BUILD_NUMBER"
        
        # Check jekyllFolder destination
        if [ -z "$jekyllFolder" ]; then
          echo "❌ ERROR: jekyllFolder destination is not set"
          exit 1
        fi
        echo "✅ jekyllFolder destination: $jekyllFolder"
        
        # Check robqbot credentials
        if [ -z "$robqbot_TOKEN" ]; then
          echo "❌ ERROR: robqbot_TOKEN is not set"
          exit 1
        fi
        echo "✅ robqbot_TOKEN: [SET]"
        
        if [ -z "$robqbot_EMAIL" ]; then
          echo "❌ ERROR: robqbot_EMAIL is not set"
          exit 1
        fi
        echo "✅ robqbot_EMAIL: $robqbot_EMAIL"
        
        if [ -z "$robqbot_NAME" ]; then
          echo "❌ ERROR: robqbot_NAME is not set"
          exit 1
        fi
        echo "✅ robqbot_NAME: $robqbot_NAME"
        
        # Verify workspace directory exists
        if [ ! -d "$TRAVIS_BUILD_DIR" ]; then
          echo "❌ ERROR: Workspace directory does not exist: $TRAVIS_BUILD_DIR"
          exit 1
        fi
        echo "✅ Workspace directory exists: $TRAVIS_BUILD_DIR"
        
        # Verify scripts directory exists
        if [ ! -d "$TRAVIS_BUILD_DIR/.scripts" ]; then
          echo "❌ ERROR: Scripts directory does not exist: $TRAVIS_BUILD_DIR/.scripts"
          exit 1
        fi
        echo "✅ Scripts directory exists: $TRAVIS_BUILD_DIR/.scripts"
        
        # Verify Jekyll_deploy.sh script exists
        if [ ! -f "$TRAVIS_BUILD_DIR/.scripts/Jekyll_deploy.sh" ]; then
          echo "❌ ERROR: Jekyll_deploy.sh script not found: $TRAVIS_BUILD_DIR/.scripts/Jekyll_deploy.sh"
          exit 1
        fi
        echo "✅ Jekyll_deploy.sh script found: $TRAVIS_BUILD_DIR/.scripts/Jekyll_deploy.sh"
        
        # Verify R_publish_framework.sh script exists
        if [ ! -f "$TRAVIS_BUILD_DIR/.scripts/R_publish_framework.sh" ]; then
          echo "❌ ERROR: R_publish_framework.sh script not found: $TRAVIS_BUILD_DIR/.scripts/R_publish_framework.sh"
          exit 1
        fi
        echo "✅ R_publish_framework.sh script found: $TRAVIS_BUILD_DIR/.scripts/R_publish_framework.sh"
        
        echo "🎯 All deploy destination variables validated successfully!"
        
        echo "Git status before deploy:";
        git status || true
        echo "Current origin configuration:";
        git remote -v || true
        echo "Running deploy script with trace..."
        bash -x "$TRAVIS_BUILD_DIR/.scripts/Jekyll_deploy.sh"
        echo "Git status after deploy:";
        git status || true
        
        # Calculate step duration
        deploy_end_time=$(date +%s)
        deploy_duration=$((deploy_end_time - deploy_start_time))
        
        echo "📊 Post-deploy resource status:"
        metrics "POST-DEPLOY"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Deploy Duration: ${deploy_duration} seconds"
        echo "  Start Time: $(date -d @$deploy_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"
