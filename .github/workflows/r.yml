        # Check workspace directory
        if [ -z "$GITHUB_WORKSPACE" ]; then
          echo "❌ ERROR: GITHUB_WORKSPACE is not set"
          exit 1
        fi
        echo "✅ GitHub Actions workspace: $GITHUB_WORKSPACE"
        
        # Check build number
        if [ -z "$GITHUB_RUN_NUMBER" ]; then
          echo "❌ ERROR: GITHUB_RUN_NUMBER is not set"
          exit 1
        fi
        echo "✅ GitHub Actions build number: $GITHUB_RUN_NUMBER"
        
        # Check jekyllFolder destination
        if [ -z "$jekyllFolder" ]; then
          echo "❌ ERROR: jekyllFolder destination is not set"
          exit 1
        fi
        echo "✅ jekyllFolder destination: $jekyllFolder"
        
        # Check robqbot credentials (will be passed as parameters to script)
        if [ -z "$robqbot_TOKEN" ]; then
          echo "❌ ERROR: robqbot_TOKEN is not set"
          echo "   This token will be passed to the Jekyll deployment script"
          exit 1
        fi
        echo "✅ robqbot_TOKEN: [SET] (will be passed as --token parameter)"
        
        if [ -z "$robqbot_EMAIL" ]; then
          echo "❌ ERROR: robqbot_EMAIL is not set"
          echo "   This email will be passed to the Jekyll deployment script"
          exit 1
        fi
        echo "✅ robqbot_EMAIL: $robqbot_EMAIL (will be passed as --email parameter)"
        
        if [ -z "$robqbot_NAME" ]; then
          echo "❌ ERROR: robqbot_NAME is not set"
          echo "   This name will be passed to the Jekyll deployment script"
          exit 1
        fi
        echo "✅ robqbot_NAME: $robqbot_NAME (will be passed as --name parameter)"
        
        # Verify workspace directory exists
        if [ ! -d "$GITHUB_WORKSPACE" ]; then
          echo "❌ ERROR: Workspace directory does not exist: $GITHUB_WORKSPACE"
          exit 1
        fi
        echo "✅ Workspace directory exists: $GITHUB_WORKSPACE"
        
        # Verify scripts directory exists
        if [ ! -d "$GITHUB_WORKSPACE/.scripts" ]; then
          echo "❌ ERROR: Scripts directory does not exist: $GITHUB_WORKSPACE/.scripts"
          exit 1
        fi
        echo "✅ Scripts directory exists: $GITHUB_WORKSPACE/.scripts"
        
        # Verify Jekyll_content_deploy.sh script exists
        if [ ! -f "$GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh" ]; then
          echo "❌ ERROR: Jekyll_content_deploy.sh script not found: $GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh"
          exit 1
        fi
        echo "✅ Jekyll_content_deploy.sh script found: $GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh"
        
        # Verify R_publish_framework.sh script exists
        if [ ! -f "$GITHUB_WORKSPACE/.scripts/R_publish_framework.sh" ]; then
          echo "❌ ERROR: R_publish_framework.sh script not found: $GITHUB_WORKSPACE/.scripts/R_publish_framework.sh"
          exit 1
        fi
        echo "✅ R_publish_framework.sh script found: $GITHUB_WORKSPACE/.scripts/R_publish_framework.sh"
        
        echo "🎯 All deploy destination variables validated successfully!"
        
        echo "Git status before deploy:";
        git status || true
        echo "Current origin configuration:";
        git remote -v || true
        echo "Running deploy script with dynamic token authentication..."
        echo "Using token: ${robqbot_TOKEN:0:8}... (truncated for security)"
        echo "Using email: $robqbot_EMAIL"
        echo "Using name: $robqbot_NAME"
        echo "Using jekyll folder: $jekyllFolder"
        
        # Execute the Jekyll deployment script with dynamic token parameters
        bash -x "$GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh" \
          --token "$robqbot_TOKEN" \
          --email "$robqbot_EMAIL" \
          --name "$robqbot_NAME" \
          --jekyll-folder "$jekyllFolder" \
          --source-branch "develop"
        
        echo "Git status after deploy:";
        git status || true
        
        # Calculate step duration
        deploy_end_time=$(date +%s)
        deploy_duration=$((deploy_end_time - deploy_start_time))
        
        echo "📊 Post-deploy resource status:"
        metrics "POST-DEPLOY"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Deploy Duration: ${deploy_duration} seconds"
        echo "  Start Time: $(date -d @$deploy_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"
