name: R-CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - name: Install R packages
      run: |
        Rscript -e 'install.packages(c("devtools", "knitr"))'

    - name: Run build script on develop branch
      if: github.ref == 'refs/heads/develop'
      run: |
        bash .scripts/R_build.sh

    - name: Print branch name
      run: echo "Hello ${{ github.ref_name }}"

    - name: Run documentation script on develop branch
      if: github.ref == 'refs/heads/develop'
      run: |
        bash .scripts/R_doc.sh

    - name: Run debug script on failure
      if: failure() && github.ref == 'refs/heads/develop'
      run: |
        bash .scripts/R_debug.sh

    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ${{ runner.tool_cache }}/R
        key: ${{ runner.os }}-R-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          ${{ runner.os }}-R-

  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Deploy compiled vignettes to gh-pages
      run: |
        bash .scripts/Jekyll_deploy.sh
