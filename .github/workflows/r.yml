name: R-CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  setup-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.5']
    env:
      # Use workspace-relative paths for R libraries to ensure they're user-writable
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-${{ matrix.r-version }}
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        monitor_resources "SYSTEM-DEPS-START"
        echo "🚀 Installing system dependencies..."
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        monitor_resources "SYSTEM-DEPS-END"

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Cache R packages for R ${{ matrix.r-version }}
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Install R dependencies
      run: |
        set -euxo pipefail
        
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        # Network connectivity check
        check_network() {
          echo "🌐 Checking network connectivity..."
          if curl -s --connect-timeout 10 https://cloud.r-project.org > /dev/null; then
            echo "✅ CRAN mirror accessible"
          else
            echo "❌ WARNING: CRAN mirror not accessible"
            return 1
          fi
          
          if curl -s --connect-timeout 10 https://bioconductor.org > /dev/null; then
            echo "✅ Bioconductor accessible"
          else
            echo "❌ WARNING: Bioconductor not accessible"
            return 1
          fi
        }
        
        monitor_resources "R-DEPS-START"
        echo "🚀 Setting up R dependencies for R ${{ matrix.r-version }}..."
        
        # Check network connectivity first
        if ! check_network; then
          echo "❌ Network connectivity issues detected. Trying alternative mirrors..."
        fi
        
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths for R ${{ matrix.r-version }}:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Verify R installation
        echo "🔍 Verifying R installation..."
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed and available"
          R --version | head -1
        else
          echo "❌ ERROR: R is not installed or not in PATH"
          exit 1
        fi
        
        # Enhanced function to check if package is available with detailed logging
        check_package() {
          local pkg="$1"
          local result
          result=$(R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); if (requireNamespace('$pkg', quietly = TRUE)) { cat('AVAILABLE') } else { cat('NOT_AVAILABLE') }" 2>&1)
          local exit_code=$?
          
          if [ $exit_code -eq 0 ] && [[ "$result" == *"AVAILABLE"* ]]; then
            echo "✅ $pkg: Available"
            return 0
          else
            echo "❌ $pkg: Not available (result: $result, exit: $exit_code)"
            return 1
          fi
        }
        
        # Enhanced package installation with retry logic
        install_package_with_retry() {
          local pkg="$1"
          local pkg_type="$2"  # "cran" or "bioc"
          local max_attempts=3
          local attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "📦 Installing $pkg (attempt $attempt/$max_attempts)..."
            
            if [ "$pkg_type" = "cran" ]; then
              if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); install.packages('$pkg', repos = c('https://cloud.r-project.org', 'https://cran.rstudio.com'), lib = '$R_LIBS_USER', dependencies = TRUE)" 2>&1; then
                echo "✅ Successfully installed $pkg"
                return 0
              fi
            else
              if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); BiocManager::install('$pkg', ask = FALSE, lib = '$R_LIBS_USER', dependencies = TRUE)" 2>&1; then
                echo "✅ Successfully installed $pkg"
                return 0
              fi
            fi
            
            echo "⚠️  Attempt $attempt failed for $pkg"
            attempt=$((attempt + 1))
            
            if [ $attempt -le $max_attempts ]; then
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          
          echo "❌ Failed to install $pkg after $max_attempts attempts"
          return 1
        }
        
        # Install CRAN packages first
        echo "📦 Installing CRAN packages..."
        monitor_resources "CRAN-PACKAGES-START"
        cran_packages=("devtools" "knitr" "rmarkdown" "testthat" "usethis" "yaml" "stringr" "dplyr")
        failed_cran_packages=()
        
        for pkg in "${cran_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            if install_package_with_retry "$pkg" "cran"; then
              echo "✅ $pkg installed successfully"
            else
              echo "❌ Failed to install $pkg"
              failed_cran_packages+=("$pkg")
            fi
          fi
        done
        monitor_resources "CRAN-PACKAGES-END"
        
        # Install BiocManager
        echo "📦 Installing BiocManager..."
        if check_package "BiocManager"; then
          echo "✅ BiocManager is already available"
        else
          if install_package_with_retry "BiocManager" "cran"; then
            echo "✅ BiocManager installed successfully"
          else
            echo "❌ Failed to install BiocManager"
            failed_cran_packages+=("BiocManager")
          fi
        fi
        
        # Install Bioconductor packages
        echo "📦 Installing Bioconductor packages..."
        monitor_resources "BIOC-PACKAGES-START"
        bioc_packages=("GenomicRanges" "Gviz" "ggtree" "orthogene")
        failed_bioc_packages=()
        
        for pkg in "${bioc_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            if install_package_with_retry "$pkg" "bioc"; then
              echo "✅ $pkg installed successfully"
            else
              echo "❌ Failed to install $pkg"
              failed_bioc_packages+=("$pkg")
            fi
          fi
        done
        monitor_resources "BIOC-PACKAGES-END"
        
        # Retry failed installations
        all_failed_packages=("${failed_cran_packages[@]}" "${failed_bioc_packages[@]}")
        if [ ${#all_failed_packages[@]} -gt 0 ]; then
          echo "🔄 Retrying failed installations: ${all_failed_packages[*]}"
          monitor_resources "RETRY-PACKAGES-START"
          
          for pkg in "${all_failed_packages[@]}"; do
            echo "🔄 Final retry for $pkg..."
            if [[ " ${cran_packages[*]} BiocManager " == *" $pkg "* ]]; then
              R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); install.packages('$pkg', repos = c('https://cloud.r-project.org', 'https://cran.rstudio.com', 'https://cran.microsoft.com'), dependencies=TRUE, lib = '$R_LIBS_USER')" || echo "Failed final retry for $pkg"
            else
              R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); BiocManager::install('$pkg', ask=FALSE, lib = '$R_LIBS_USER', dependencies=TRUE)" || echo "Failed final retry for $pkg"
            fi
          done
          monitor_resources "RETRY-PACKAGES-END"
        fi
        
        # Final verification
        echo "🔍 Final verification of all required packages..."
        all_packages=("${cran_packages[@]}" "BiocManager" "${bioc_packages[@]}")
        missing_packages=()
        
        for pkg in "${all_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg: Available"
          else
            echo "❌ $pkg: Not available"
            missing_packages+=("$pkg")
          fi
        done
        
        if [ ${#missing_packages[@]} -gt 0 ]; then
          echo "❌ ERROR: The following packages are still missing after retries: ${missing_packages[*]}"
          echo "📊 Detailed R session info:"
          R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); cat('Library paths:\n'); print(.libPaths()); cat('\nInstalled packages:\n'); print(installed.packages()[,c('Package','Version')])"
          exit 1
        fi
        
        echo "✅ All required packages installed successfully"
        
        # Debug: Verify packages are actually in the cache directories
        echo "🔍 Final verification of cache directories:"
        echo "  R_LIBS_USER contents: $(ls -la "$R_LIBS_USER" 2>/dev/null | wc -l) items"
        echo "  R_LIBS_SITE contents: $(ls -la "$R_LIBS_SITE" 2>/dev/null | wc -l) items"
        echo "  Sample packages in R_LIBS_USER: $(ls "$R_LIBS_USER" 2>/dev/null | head -5 | tr '\n' ' ')"
        echo "  Sample packages in R_LIBS_SITE: $(ls "$R_LIBS_SITE" 2>/dev/null | head -5 | tr '\n' ' ')"
        
        monitor_resources "R-DEPS-END"

  build:
    needs: setup-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        r-version: ['4.5']
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-${{ matrix.r-version }}
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Restore R packages cache
      id: cache-restore
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Debug cache restore status
      run: |
        # CRITICAL: Set the correct workspace-relative paths before checking cache
        export R_LIBS_USER="${{ github.workspace }}/Rlibs-${{ matrix.r-version }}"
        export R_LIBS_SITE="${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}"
        
        echo "🔍 Cache restore status for R ${{ matrix.r-version }}:"
        echo "  Cache hit: ${{ steps.cache-restore.outputs.cache-hit }}"
        echo "  Cache key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}"
        echo "  Restore keys: r-${{ matrix.r-version }}-packages-"
        echo "  DESCRIPTION file hash: ${{ hashFiles('**/DESCRIPTION') }}"
        echo "  Workspace: ${{ github.workspace }}"
        echo "  Matrix R version: ${{ matrix.r-version }}"
        echo ""
        echo "📁 Checking expected cache directories:"
        echo "Environment variables (corrected):"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        echo ""
        if [ -d "$R_LIBS_USER" ]; then
          echo "✅ R_LIBS_USER directory exists: $R_LIBS_USER"
          echo "   Contents: $(ls -la "$R_LIBS_USER" | wc -l) items"
          if [ "$(ls -A "$R_LIBS_USER" 2>/dev/null)" ]; then
            echo "   Sample packages: $(ls "$R_LIBS_USER" | head -5 | tr '\n' ' ')"
          else
            echo "   Directory is empty"
          fi
        else
          echo "❌ R_LIBS_USER directory missing: $R_LIBS_USER"
        fi
        
        if [ -d "$R_LIBS_SITE" ]; then
          echo "✅ R_LIBS_SITE directory exists: $R_LIBS_SITE"
          echo "   Contents: $(ls -la "$R_LIBS_SITE" | wc -l) items"
          if [ "$(ls -A "$R_LIBS_SITE" 2>/dev/null)" ]; then
            echo "   Sample packages: $(ls "$R_LIBS_SITE" | head -5 | tr '\n' ' ')"
          else
            echo "   Directory is empty"
          fi
        else
          echo "❌ R_LIBS_SITE directory missing: $R_LIBS_SITE"
        fi

    - name: Verify dependencies and setup environment
      run: |
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        monitor_resources "BUILD-SETUP-START"
        echo "🔍 Verifying cached dependencies and setting up build environment..."
        
        # CRITICAL: Ensure we're using the correct workspace-relative paths
        export R_LIBS_USER="${{ github.workspace }}/Rlibs-${{ matrix.r-version }}"
        export R_LIBS_SITE="${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}"
        
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths configured:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Verify R installation and version
        echo "🔍 Verifying R installation and version..."
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed and available"
          R --version | head -1
        else
          echo "❌ ERROR: R is not installed or not in PATH"
          exit 1
        fi
        
        # Verify required system tools are available
        echo "🔍 Verifying system dependencies..."
        missing_tools=()
        
        if ! command -v pandoc >/dev/null 2>&1; then
          echo "❌ pandoc not found"
          missing_tools+=("pandoc")
        else
          echo "✅ pandoc: $(pandoc --version | head -1)"
        fi
        
        if ! command -v pdflatex >/dev/null 2>&1; then
          echo "❌ pdflatex not found"
          missing_tools+=("pdflatex/texlive")
        else
          echo "✅ pdflatex: available"
        fi
        
        # Check if curl/wget available for package downloads
        if command -v curl >/dev/null 2>&1; then
          echo "✅ curl: available"
        elif command -v wget >/dev/null 2>&1; then
          echo "✅ wget: available"
        else
          echo "❌ Neither curl nor wget found"
          missing_tools+=("curl or wget")
        fi
        
        if [ ${#missing_tools[@]} -gt 0 ]; then
          echo "⚠️  Missing system tools: ${missing_tools[*]}"
          echo "🔧 Installing missing system dependencies..."
          bash .scripts/install_dependencies.sh system
          bash .scripts/install_dependencies.sh texlive
          bash .scripts/install_dependencies.sh pandoc
        else
          echo "✅ All required system dependencies are available"
        fi
        
        # Verify cached R packages are accessible
        echo "🔍 Verifying cached R packages..."
        
        # Function to check if package is available in cache directories only
        check_package() {
          local pkg="$1"
          # Check only in the cache directories, not system libraries
          R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (requireNamespace('$pkg', quietly = TRUE)) { cat('AVAILABLE') } else { cat('NOT_AVAILABLE') }" 2>/dev/null | grep -q "AVAILABLE"
        }
        
        required_packages=("devtools" "BiocManager" "knitr" "rmarkdown" "GenomicRanges" "Gviz" "ggtree" "orthogene")
        missing_packages=()
        
        for pkg in "${required_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg: Available from cache"
          else
            echo "❌ $pkg: Not available in cache"
            missing_packages+=("$pkg")
          fi
        done
        
        if [ ${#missing_packages[@]} -gt 0 ]; then
          echo "⚠️  Required R packages missing from cache: ${missing_packages[*]}"
          echo "🔄 This indicates a cache miss or setup-dependencies job failure"
          echo "📊 Available packages in cache:"
          ls -la "$R_LIBS_USER" 2>/dev/null || echo "Cache directory not found"
          
          echo "🛡️  INITIATING REDUNDANCY PATHWAY 1: Quick package installation"
          monitor_resources "REDUNDANCY-INSTALL-START"
          
          # Enhanced package installation with retry logic
          install_package_with_retry() {
            local pkg="$1"
            local pkg_type="$2"  # "cran" or "bioc"
            local max_attempts=2
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "📦 Installing $pkg (redundancy attempt $attempt/$max_attempts)..."
              
              if [ "$pkg_type" = "cran" ]; then
                if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); install.packages('$pkg', repos = c('https://cloud.r-project.org', 'https://cran.rstudio.com', 'https://cran.microsoft.com'), lib = '$R_LIBS_USER', dependencies = TRUE)" 2>&1; then
                  echo "✅ Successfully installed $pkg"
                  return 0
                fi
              else
                # Install BiocManager first if needed for bioc packages
                if ! R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); requireNamespace('BiocManager', quietly = TRUE)" 2>/dev/null; then
                  echo "📦 Installing BiocManager first..."
                  R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); install.packages('BiocManager', repos = 'https://cloud.r-project.org', lib = '$R_LIBS_USER')"
                fi
                
                if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); BiocManager::install('$pkg', ask = FALSE, lib = '$R_LIBS_USER', dependencies = TRUE)" 2>&1; then
                  echo "✅ Successfully installed $pkg"
                  return 0
                fi
              fi
              
              echo "⚠️  Redundancy attempt $attempt failed for $pkg"
              attempt=$((attempt + 1))
              
              if [ $attempt -le $max_attempts ]; then
                echo "⏳ Waiting 15 seconds before retry..."
                sleep 15
              fi
            done
            
            echo "❌ Failed to install $pkg after $max_attempts redundancy attempts"
            return 1
          }
          
          # Try to install missing packages
          redundancy_failed_packages=()
          
          for pkg in "${missing_packages[@]}"; do
            # Determine package type
            if [[ " devtools knitr rmarkdown BiocManager testthat usethis yaml stringr dplyr " == *" $pkg "* ]]; then
              pkg_type="cran"
            else
              pkg_type="bioc"
            fi
            
            if install_package_with_retry "$pkg" "$pkg_type"; then
              echo "✅ Redundancy installation successful for $pkg"
            else
              redundancy_failed_packages+=("$pkg")
            fi
          done
          
          monitor_resources "REDUNDANCY-INSTALL-END"
          
          # If redundancy pathway 1 fails, try pathway 2
          if [ ${#redundancy_failed_packages[@]} -gt 0 ]; then
            echo "🛡️  INITIATING REDUNDANCY PATHWAY 2: Alternative installation methods"
            monitor_resources "REDUNDANCY-ALT-START"
            
            # Try using pak for faster installation
            echo "📦 Attempting installation via pak..."
            if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); if (!requireNamespace('pak', quietly = TRUE)) { install.packages('pak', repos = 'https://r-lib.github.io/p/pak/stable/', lib = '$R_LIBS_USER') }" 2>/dev/null; then
              
              final_failed_packages=()
              for pkg in "${redundancy_failed_packages[@]}"; do
                echo "📦 Installing $pkg via pak..."
                if [[ " devtools knitr rmarkdown BiocManager testthat usethis yaml stringr dplyr " == *" $pkg "* ]]; then
                  # CRAN package
                  if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); pak::pkg_install('$pkg', lib = '$R_LIBS_USER')" 2>/dev/null; then
                    echo "✅ pak installation successful for $pkg"
                  else
                    final_failed_packages+=("$pkg")
                  fi
                else
                  # Bioconductor package
                  if R --slave -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); pak::pkg_install('bioc::$pkg', lib = '$R_LIBS_USER')" 2>/dev/null; then
                    echo "✅ pak installation successful for $pkg"
                  else
                    final_failed_packages+=("$pkg")
                  fi
                fi
              done
              
              if [ ${#final_failed_packages[@]} -eq 0 ]; then
                echo "✅ All packages successfully installed via redundancy pathway 2"
              else
                echo "🛡️  INITIATING REDUNDANCY PATHWAY 3: Minimal functionality mode"
                echo "⚠️  Final failed packages: ${final_failed_packages[*]}"
                
                # Check if we have enough packages for basic functionality
                critical_packages=("devtools" "knitr" "rmarkdown")
                critical_missing=()
                
                for pkg in "${critical_packages[@]}"; do
                  if [[ " ${final_failed_packages[*]} " == *" $pkg "* ]]; then
                    critical_missing+=("$pkg")
                  fi
                done
                
                if [ ${#critical_missing[@]} -eq 0 ]; then
                  echo "✅ Critical packages available - proceeding with reduced functionality"
                  echo "⚠️  Note: Some advanced features may not work due to missing packages: ${final_failed_packages[*]}"
                else
                  echo "❌ CRITICAL ERROR: Essential packages missing: ${critical_missing[*]}"
                  echo "🔄 Cannot proceed with build - critical functionality compromised"
                  exit 1
                fi
              fi
            else
              echo "❌ pak installation failed"
              echo "🛡️  REDUNDANCY PATHWAY 3: Critical package check"
              
              # Final check - can we proceed with minimal functionality?
              critical_packages=("devtools" "knitr" "rmarkdown")
              available_critical=()
              
              for pkg in "${critical_packages[@]}"; do
                if check_package "$pkg"; then
                  available_critical+=("$pkg")
                fi
              done
              
              if [ ${#available_critical[@]} -ge 2 ]; then
                echo "✅ Minimal critical packages available (${available_critical[*]}) - proceeding with limited functionality"
                echo "⚠️  WARNING: Build may fail due to missing packages: ${redundancy_failed_packages[*]}"
              else
                echo "❌ CRITICAL FAILURE: Too few critical packages available"
                echo "🔄 Cannot proceed - build environment compromised"
                exit 1
              fi
            fi
            
            monitor_resources "REDUNDANCY-ALT-END"
          else
            echo "✅ All missing packages successfully installed via redundancy pathway 1"
          fi
        else
          echo "✅ All required R packages are available from cache"
        fi
        
        monitor_resources "BUILD-SETUP-END"

    - name: Build and test package
      if: github.ref == 'refs/heads/develop'
      run: |
        set -euxo pipefail
        
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        monitor_resources "BUILD-START"
        echo "🚀 Building and testing SyntenyViz package..."
        
        # CRITICAL: Set R library paths to workspace-relative paths for cache consistency
        echo "🔧 Configuring R library paths for R ${{ matrix.r-version }}..."
        echo "Matrix R version: ${{ matrix.r-version }}"
        
        # Force the correct workspace-relative paths
        export R_LIBS_USER="${{ github.workspace }}/Rlibs-${{ matrix.r-version }}"
        export R_LIBS_SITE="${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}"
        
        echo "Final paths to be used:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Comprehensive package verification before build
        echo "🔍 Verifying all required packages are available..."
        monitor_resources "PACKAGE-CHECK-START"
        
        # Debug and verify library paths first
        echo "🔍 Debugging library path configuration..."
        echo "Environment variables:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        echo "Directory contents:"
        echo "  R_LIBS_USER contents: $(ls -la "$R_LIBS_USER" 2>/dev/null | wc -l) items"
        echo "  R_LIBS_SITE contents: $(ls -la "$R_LIBS_SITE" 2>/dev/null | wc -l) items"
        
        # Show actual directory contents for debugging
        if [ -d "$R_LIBS_USER" ]; then
          echo "📁 R_LIBS_USER directory ($R_LIBS_USER):"
          ls -la "$R_LIBS_USER" | head -10
        else
          echo "❌ R_LIBS_USER directory does not exist: $R_LIBS_USER"
        fi
        
        if [ -d "$R_LIBS_SITE" ]; then
          echo "📁 R_LIBS_SITE directory ($R_LIBS_SITE):"
          ls -la "$R_LIBS_SITE" | head -10
        else
          echo "❌ R_LIBS_SITE directory does not exist: $R_LIBS_SITE"
        fi
        
        # Set R environment variables for this session
        export R_LIBS_USER="$R_LIBS_USER"
        export R_LIBS_SITE="$R_LIBS_SITE"
        
        Rscript -e "
          # CRITICAL: Use the same paths as the environment variables
          lib_user <- Sys.getenv('R_LIBS_USER')
          lib_site <- Sys.getenv('R_LIBS_SITE')
          
          # Debug: Show what paths we're using
          cat('🔍 Environment paths from R:\n')
          cat('  R_LIBS_USER:', lib_user, '\n')
          cat('  R_LIBS_SITE:', lib_site, '\n')
          
          # Set library paths with cache directories first, then system libraries
          .libPaths(c(lib_user, lib_site, .libPaths()))
          
          cat('📋 Checking R library paths after explicit setting:\n')
          print(.libPaths())
          
          cat('\n📊 Checking if directories exist and are readable:\n')
          for(path in .libPaths()) {
            exists <- dir.exists(path)
            readable <- file.access(path, 4) == 0
            cat('  ', path, ': exists=', exists, ', readable=', readable, '\n')
            if(exists && readable) {
              packages <- list.files(path)
              cat('    Packages found:', length(packages), '\n')
              if(length(packages) > 0) {
                cat('    First 5 packages:', paste(head(packages, 5), collapse=', '), '\n')
              }
            }
          }
          
          cat('\n📦 Verifying required packages:\n')
          required_packages <- c('devtools', 'BiocManager', 'knitr', 'rmarkdown', 'testthat', 'usethis', 'yaml', 'stringr', 'dplyr', 'GenomicRanges', 'Gviz', 'ggtree', 'orthogene')
          missing <- character(0)
          available <- character(0)
          
          for(pkg in required_packages) {
            if(requireNamespace(pkg, quietly = TRUE)) {
              available <- c(available, pkg)
              cat('✅', pkg, ': Available\n')
            } else {
              missing <- c(missing, pkg)
              cat('❌', pkg, ': NOT AVAILABLE\n')
            }
          }
          
          cat('\n📊 Package Summary:\n')
          cat('  Available:', length(available), 'packages\n')
          cat('  Missing:', length(missing), 'packages\n')
          
          if(length(missing) > 0) {
            cat('\n❌ MISSING PACKAGES:\n')
            for(pkg in missing) cat('  -', pkg, '\n')
            
            cat('\n📋 All installed packages in all libraries:\n')
            for(lib in .libPaths()) {
              if(dir.exists(lib)) {
                packages <- list.files(lib)
                cat('Library:', lib, '(', length(packages), 'packages)\n')
                if(length(packages) > 0) {
                  cat('  Packages:', paste(head(packages, 10), collapse=', '), '\n')
                }
              }
            }
            stop('❌ Build cannot proceed: Missing required packages: ', paste(missing, collapse = ', '))
          } else {
            cat('\n✅ All required packages are available - build can proceed\n')
          }
        "
        
        monitor_resources "PACKAGE-CHECK-END"
        
        # Build and install the package
        echo "📦 Building and installing SyntenyViz..."
        monitor_resources "PACKAGE-INSTALL-START"
        Rscript -e ".libPaths(c('${{ github.workspace }}/Rlibs-${{ matrix.r-version }}', '${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}', .libPaths())); devtools::install()"
        monitor_resources "PACKAGE-INSTALL-END"
        
        # Build package tarball
        echo "📦 Building package tarball..."
        monitor_resources "PACKAGE-BUILD-START"
        Rscript -e ".libPaths(c('${{ github.workspace }}/Rlibs-${{ matrix.r-version }}', '${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}', .libPaths())); devtools::build()"
        monitor_resources "PACKAGE-BUILD-END"
        
        # Build documentation
        echo "📖 Building documentation..."
        monitor_resources "DOCS-BUILD-START"
        Rscript -e ".libPaths(c('${{ github.workspace }}/Rlibs-${{ matrix.r-version }}', '${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}', .libPaths())); devtools::document()"
        monitor_resources "DOCS-BUILD-END"
        
        # Build vignettes
        echo "📖 Building vignettes..."
        monitor_resources "VIGNETTES-START"
        Rscript -e ".libPaths(c('${{ github.workspace }}/Rlibs-${{ matrix.r-version }}', '${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}', .libPaths())); devtools::build_vignettes()"
        monitor_resources "VIGNETTES-END"
        
        echo "✅ Build completed successfully"
        monitor_resources "BUILD-END"

    - name: Upload R ${{ matrix.r-version }} Package Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: syntenyviz-r${{ matrix.r-version }}-package
        path: |
          SyntenyViz_*.tar.gz
          man/
          vignettes/*.html
          vignettes/*.Rmd
        retention-days: 30
        if-no-files-found: error

    - name: Add PR Comment - Success
      if: github.event_name == 'pull_request' && success()
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ✅ **Multi-Version Build Successful** 
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          **R Version:** `${{ matrix.r-version }}`
          
          **Job Status:**
          - ✅ Dependencies setup completed
          - ✅ System dependencies installed
          - ✅ Package compilation completed (R ${{ matrix.r-version }})
          - ✅ Documentation built successfully
          - ✅ All vignettes built successfully
          - ✅ Package checks passed
          - ✅ All outputs verified
          - ✅ Artifacts uploaded for R ${{ matrix.r-version }}
          
          **Next Steps:** Ready for review and testing across R versions.
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Add PR Comment - Failure
      if: github.event_name == 'pull_request' && failure()
      uses: thollander/actions-comment-pull-request@v3
      with:
        message: |
          ❌ **Multi-Version Build Failed**
          
          **Branch:** `${{ github.head_ref }}`
          **Commit:** `${{ github.sha }}`
          **Triggered by:** `${{ github.actor }}`
          **R Version:** `${{ matrix.r-version }}`
          
          The build for R ${{ matrix.r-version }} encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          
          **Common Issues to Check:**
          - R ${{ matrix.r-version }} package dependencies
          - System library requirements
          - Vignette rendering errors
          - Documentation generation issues
          - Package check failures
        github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [setup-dependencies, build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      # Use latest R version for deployment (most compatible)
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-latest
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up R latest
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: latest

    - name: Restore R packages cache for latest version
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-latest-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-latest-packages-

    - name: Install R Latest and Package
      run: |
        set -euxo pipefail
        
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        monitor_resources "DEPLOY-SETUP-START"
        echo "🚀 Setting up R environment and installing package..."
        
        # Set up R environment for latest version
        export R_LIBS_USER=${{ github.workspace }}/Rlibs-latest
        export R_LIBS_SITE=${{ github.workspace }}/Rlibs-site-latest
        mkdir -p "$R_LIBS_USER" "$R_LIBS_SITE"
        
        # Install system dependencies
        echo "🔧 Installing system dependencies..."
        monitor_resources "DEPLOY-DEPS-START"
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        monitor_resources "DEPLOY-DEPS-END"
        
        # Verify R installation
        if ! command -v R >/dev/null 2>&1; then
          echo "❌ ERROR: R latest is not installed or not in PATH"
          exit 1
        fi
        echo "✅ R latest installed: $(R --version | head -1)"
        
        # Check if build artifacts are available from cache
        monitor_resources "PACKAGE-INSTALL-START"
        PACKAGE_TARBALL=$(find . -name "SyntenyViz_*.tar.gz" | head -1)
        if [ -n "$PACKAGE_TARBALL" ]; then
          echo "📦 Installing SyntenyViz package from cached tarball..."
          R CMD INSTALL "$PACKAGE_TARBALL" --library="$R_LIBS_USER"
          echo "✅ Package installed successfully from cache"
        else
          echo "⚠️  No cached package tarball found, will build from source"
          # Fallback: build from source
          bash .scripts/R_build.sh
          
          # Install the newly built package
          PACKAGE_TARBALL=$(find . -name "SyntenyViz_*.tar.gz" | head -1)
          if [ -n "$PACKAGE_TARBALL" ]; then
            echo "📦 Installing newly built SyntenyViz package..."
            R CMD INSTALL "$PACKAGE_TARBALL" --library="$R_LIBS_USER"
            echo "✅ Package installed successfully from fresh build"
          fi
        fi
        monitor_resources "PACKAGE-INSTALL-END"
        
        # Verify package installation
        if Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); library(SyntenyViz)" 2>/dev/null; then
          echo "✅ SyntenyViz package verified and ready for deployment"
        else
          echo "❌ SyntenyViz package verification failed"
          exit 1
        fi
        monitor_resources "DEPLOY-SETUP-END"

    - name: Configure Git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Deploy compiled vignettes to gh-pages
      env:
        # GitHub Actions environment variables
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        # Deployment configuration
        jekyllFolder: docs
        # Bot credentials for automated commits (can be overridden by command line)
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_NAME: "robqbot"
      run: |
        set -euxo pipefail
        
        # Source the centralized monitoring script
        source .scripts/monitor_resources.sh
        
        monitor_resources "DEPLOY-START"
        echo "📚 Deploying documentation to gh-pages..."
        
        # Validate required environment variables
        if [ -z "$GITHUB_WORKSPACE" ] || [ -z "$jekyllFolder" ] || [ -z "$robqbot_TOKEN" ]; then
          echo "❌ ERROR: Required environment variables not set"
          exit 1
        fi
        
        # Verify scripts exist
        if [ ! -f "$GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh" ]; then
          echo "❌ ERROR: Jekyll_content_deploy.sh script not found"
          exit 1
        fi
        
        echo "🚀 Running Jekyll deployment script..."
        monitor_resources "JEKYLL-DEPLOY-START"
        bash "$GITHUB_WORKSPACE/.scripts/Jekyll_content_deploy.sh" \
          --token "$robqbot_TOKEN" \
          --email "$robqbot_EMAIL" \
          --name "$robqbot_NAME" \
          --jekyll-folder "$jekyllFolder" \
          --source-branch "develop"
        monitor_resources "JEKYLL-DEPLOY-END"
        
        echo "✅ Deployment completed successfully"
        monitor_resources "DEPLOY-END"
