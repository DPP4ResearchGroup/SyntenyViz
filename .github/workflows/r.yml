          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        step_start_time=$(date +%s)
        
        echo "📊 Pre-system dependencies, TeX Live, and Pandoc resource status:"
        metrics "PRE-SYSTEM-DEPENDENCIES-TEX-PANDOC"
        
        echo "🚀 Installing system dependencies using centralized script..."
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        
        # Calculate step duration
        step_end_time=$(date +%s)
        step_duration=$((step_end_time - step_start_time))
        
        echo "✅ System dependencies, TeX Live, and Pandoc installed successfully!"
        echo "📊 Post-system dependencies, TeX Live, and Pandoc resource status:"
        metrics "POST-SYSTEM-DEPENDENCIES-TEX-PANDOC"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Step Duration: ${step_duration} seconds"
        echo "  Start Time: $(date -d @$step_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Comprehensive Build and Documentation (Live Mode - With Commits)
      if: github.ref == 'refs/heads/develop'
      env:
        TRAVIS_BUILD_DIR: ${{ github.workspace }}
        TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
        jekyllFolder: docs
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_NAME: "robqbot"
      run: |
        set -euxo pipefail
        
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
          if [ ! -f "$perf_file" ]; then
            echo "step_name,timestamp,cpu_usage,memory_usage,swap_usage,disk_usage,process_count,r_processes,top_mem,top_cpu" > "$perf_file"
          fi
          
          # Capture current metrics
          local cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')
          local mem_usage=$(free | grep Mem | awk '{printf "%.1f", $3/$2 * 100.0}' 2>/dev/null || echo 'N/A')
          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          else
            echo "💿 DISK: Current: N/A | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this comprehensive step
        comprehensive_start_time=$(date +%s)
        
        echo "📊 Pre-comprehensive build resource status:"
        metrics "PRE-COMPREHENSIVE-BUILD"
        
        echo "🚀 Starting comprehensive build process..."
        echo "🔓 LIVE BUILD JOB: This job will compile, test, document, and commit changes"
        echo "✅ COMMITS ENABLED: Changes will be committed directly"
        echo "Current directory: $(pwd)"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        
        # Validate environment
        echo "🔍 Validating environment variables..."
        if [ -z "$TRAVIS_BUILD_DIR" ]; then
          echo "❌ ERROR: TRAVIS_BUILD_DIR is not set"
          exit 1
        fi
        echo "✅ TRAVIS_BUILD_DIR: $TRAVIS_BUILD_DIR"
        
        if [ -z "$TRAVIS_BUILD_NUMBER" ]; then
          echo "❌ ERROR: TRAVIS_BUILD_NUMBER is not set"
          exit 1
        fi
        echo "✅ TRAVIS_BUILD_NUMBER: $TRAVIS_BUILD_NUMBER"
        
        # Verify workspace and scripts
        echo "🔍 Verifying workspace and scripts..."
        if [ ! -d "$TRAVIS_BUILD_DIR" ]; then
          echo "❌ ERROR: Workspace directory does not exist: $TRAVIS_BUILD_DIR"
          exit 1
        fi
        echo "✅ Workspace directory exists: $TRAVIS_BUILD_DIR"
        
        if [ ! -d "$TRAVIS_BUILD_DIR/.scripts" ]; then
          echo "❌ ERROR: Scripts directory does not exist: $TRAVIS_BUILD_DIR/.scripts"
          exit 1
        fi
        echo "✅ Scripts directory exists: $TRAVIS_BUILD_DIR/.scripts"
        
        # Check package files
        echo "📋 Package information:"
        echo "Contents of current directory:"
        ls -la
        echo "Package DESCRIPTION file:"
        test -f DESCRIPTION && cat DESCRIPTION || echo "DESCRIPTION not found"
        echo "Package NAMESPACE file:"
        test -f NAMESPACE && cat NAMESPACE || echo "NAMESPACE not found"
        
        # Configure git for commits
        echo "🔧 Configuring git for commits..."
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Build documentation and vignettes first
        echo "📚 Building documentation and vignettes..."
        echo "📊 Pre-documentation build resource status:"
        metrics "PRE-DOC-BUILD"
        
        # Build documentation with error handling
        if ! Rscript -e 'devtools::document()'; then
          echo "❌ ERROR: devtools::document() failed"
          exit 1
        fi
        echo "✅ devtools::document() completed successfully"
        
        # Build vignettes with comprehensive error handling
        echo "📖 Building vignettes..."
        if ! Rscript -e 'devtools::build_vignettes()'; then
          echo "❌ ERROR: devtools::build_vignettes() failed"
          echo "🔍 Checking vignette files for issues..."
          
          # List all vignette files
          echo "Vignette files found:"
          find vignettes -name "*.Rmd" -o -name "*.R" | head -10
          
          # Check each vignette individually
          for vignette in vignettes/*.Rmd; do
            if [ -f "$vignette" ]; then
              echo "🔍 Checking vignette: $vignette"
              if ! Rscript -e "rmarkdown::render('$vignette', quiet = FALSE)"; then
                echo "❌ ERROR: Vignette $vignette failed to render"
                echo "📋 Vignette content (first 50 lines):"
                head -50 "$vignette"
                exit 1
              else
                echo "✅ Vignette $vignette rendered successfully"
              fi
            fi
          done
          
          # If we get here, try build_vignettes again
          echo "🔄 Retrying devtools::build_vignettes()..."
          if ! Rscript -e 'devtools::build_vignettes()'; then
            echo "❌ ERROR: devtools::build_vignettes() failed on retry"
            exit 1
          fi
        fi
        echo "✅ devtools::build_vignettes() completed successfully"
        
        echo "📊 Post-documentation build resource status:"
        metrics "POST-DOC-BUILD"
        
        # Build and check package
        echo "📦 Building and checking package..."
        echo "📊 Pre-package build resource status:"
        metrics "PRE-PKG-BUILD"
        
        # Use GitHub Actions workspace instead of TRAVIS_BUILD_DIR
        cd "${GITHUB_WORKSPACE}/.." || exit 1
        
        # Build package with error handling
        if ! R CMD build "SyntenyViz"; then
          echo "❌ ERROR: R CMD build failed"
          exit 1
        fi
        echo "✅ R CMD build completed successfully"
        
        # Check package with error handling
        if ! R CMD check "SyntenyViz_*.tar.gz" --check-subdirs=yes; then
          echo "❌ ERROR: R CMD check failed"
          echo "🔍 Checking for common issues..."
          
          # List check results
          if [ -d "SyntenyViz.Rcheck" ]; then
            echo "📋 Check results directory contents:"
            ls -la SyntenyViz.Rcheck/
            
            if [ -f "SyntenyViz.Rcheck/00check.log" ]; then
              echo "📋 Check log (last 100 lines):"
              tail -100 SyntenyViz.Rcheck/00check.log
            fi
          fi
          exit 1
        fi
        echo "✅ R CMD check completed successfully"
        
        echo "📊 Post-package build resource status:"
        metrics "POST-PKG-BUILD"
        
        # Verify all outputs
        echo "🔍 Verifying all build outputs..."
        echo "📊 Pre-verification resource status:"
        metrics "PRE-VERIFICATION"
        
        # Go back to the package directory
        cd "${GITHUB_WORKSPACE}" || exit 1
        
        # Check if documentation was created
        if [ ! -d "man" ] || [ -z "$(ls -A man 2>/dev/null)" ]; then
          echo "❌ ERROR: No man pages found in man/ directory"
          exit 1
        fi
        echo "✅ Man pages found: $(ls man/ | wc -l) files"
        
        # Check if vignettes were built
        if [ ! -d "vignettes" ] || [ -z "$(find vignettes -name "*.html" 2>/dev/null)" ]; then
          echo "❌ ERROR: No built vignettes found"
          echo "📋 Vignettes directory contents:"
          ls -la vignettes/
          exit 1
        fi
        echo "✅ Built vignettes found: $(find vignettes -name "*.html" | wc -l) files"
        
        # Check if package tarball was created
        if [ ! -f "../SyntenyViz_*.tar.gz" ]; then
          echo "❌ ERROR: No package tarball found"
          exit 1
        fi
        echo "✅ Package tarball created: $(ls ../SyntenyViz_*.tar.gz)"
        
        # List all outputs
        echo "📋 All build outputs:"
        echo "  Man pages: $(ls man/ | wc -l) files"
        echo "  Vignettes: $(find vignettes -name "*.html" | wc -l) files"
        echo "  Package: $(ls ../SyntenyViz_*.tar.gz | wc -l) tarball(s)"
        
        echo "📊 Post-verification resource status:"
        metrics "POST-VERIFICATION"
        
        # Now use R_doc.sh for documentation commits and deployment
        echo "🚀 Running R_doc.sh for documentation commits and deployment..."
        echo "📊 Pre-R_doc.sh resource status:"
        metrics "PRE-R-DOC-SCRIPT"
        
        # Set required environment variables for R_doc.sh
        export jekyllFolder="docs"
        export robqbot_TOKEN="${robqbot_TOKEN}"
        export robqbot_EMAIL="${robqbot_EMAIL}"
        export robqbot_NAME="${robqbot_NAME}"
        
        # Run R_doc.sh script
        bash -x .scripts/R_doc.sh
        
        echo "📊 Post-R_doc.sh resource status:"
        metrics "POST-R-DOC-SCRIPT"
        
        # Calculate step duration
        comprehensive_end_time=$(date +%s)
        comprehensive_duration=$((comprehensive_end_time - comprehensive_start_time))
        
        echo "📊 Post-comprehensive build resource status:"
        metrics "POST-COMPREHENSIVE-BUILD"
        
        # Comprehensive build summary
        echo "🎯 COMPREHENSIVE BUILD SUMMARY:"
        echo "  ✅ Package compilation completed"
        echo "  ✅ Documentation built successfully"
        echo "  ✅ All vignettes built successfully"
        echo "  ✅ Package checks passed"
        echo "  ✅ All outputs verified"
        echo "  ✅ R_doc.sh executed for commits and deployment"
        echo "  📦 Build completed and deployed"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Comprehensive Build Duration: ${comprehensive_duration} seconds"
        echo "  Start Time: $(date -d @$comprehensive_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"


    - name: Run comprehensive debug script on failure
