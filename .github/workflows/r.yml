name: R-CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  setup-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.4', 'latest']
    env:
      # Use workspace-relative paths for R libraries to ensure they're user-writable
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-${{ matrix.r-version }}
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Generate cache key for R ${{ matrix.r-version }}
      id: cache-key
      run: |
        echo "value=r-${{ matrix.r-version }}-deps-${{ hashFiles('**/DESCRIPTION') }}" >> $GITHUB_OUTPUT

    - name: Cache system dependencies for R ${{ matrix.r-version }}
      uses: actions/cache@v4
      with:
        path: |
          /usr/bin/pandoc
          /usr/share/texlive
          /usr/lib/x86_64-linux-gnu/libcurl*
          /usr/lib/x86_64-linux-gnu/libssl*
          /usr/lib/x86_64-linux-gnu/libxml2*
        key: system-deps-r-${{ matrix.r-version }}-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          system-deps-r-${{ matrix.r-version }}-
          system-deps-

    - name: Install R and Sys deps using centralized script
      run: |
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
          if [ ! -f "$perf_file" ]; then
            echo "step_name,timestamp,cpu_usage,memory_usage,swap_usage,disk_usage,process_count,r_processes,top_mem,top_cpu" > "$perf_file"
          fi
          
          # Capture current metrics
          local cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')
          local mem_usage=$(free | grep Mem | awk '{printf "%.1f", $3/$2 * 100.0}' 2>/dev/null || echo 'N/A')
          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          else
            echo "💿 DISK: Current: N/A | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        r_setup_start_time=$(date +%s)
        
        echo "📊 Pre-R setup resource status:"
        metrics "PRE-R-SETUP"
        
        echo "🚀 Installing system dependencies using centralized script..."
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        
        # Calculate step duration
        r_setup_end_time=$(date +%s)
        r_setup_duration=$((r_setup_end_time - r_setup_start_time))
        
        echo "📊 Post-R setup resource status:"
        metrics "POST-R-SETUP"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  R Setup Duration: ${r_setup_duration} seconds"
        echo "  Start Time: $(date -d @$r_setup_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Cache R packages for R ${{ matrix.r-version }}
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Set up R dependencies with performance monitoring
      run: |
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
          if [ ! -f "$perf_file" ]; then
            echo "step_name,timestamp,cpu_usage,memory_usage,swap_usage,disk_usage,process_count,r_processes,top_mem,top_cpu" > "$perf_file"
          fi
          
          # Capture current metrics
          local cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')
          local mem_usage=$(free | grep Mem | awk '{printf "%.1f", $3/$2 * 100.0}' 2>/dev/null || echo 'N/A')
          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          else
            echo "💿 DISK: Current: N/A | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        r_deps_start_time=$(date +%s)
        
        echo "📊 Pre-R dependencies setup resource status:"
        metrics "PRE-R-DEPENDENCIES-SETUP"
        
        echo "🚀 Setting up R dependencies with pak for R ${{ matrix.r-version }}..."
        
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths for R ${{ matrix.r-version }}:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # R installation is now handled by r-lib/actions/setup-r action above
        # Verify R installation and version
        echo "🔍 Verifying R installation from r-lib action..."
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed and available"
          R --version | head -1
          echo "🎯 Target R version: ${{ matrix.r-version }}"
          
          # Verify we're using the correct R version
          CURRENT_R_VERSION=$(R --version | head -1 | grep -o '[0-9]\+\.[0-9]\+' | head -1)
          TARGET_R_VERSION="${{ matrix.r-version }}"
          
          if [ "$TARGET_R_VERSION" = "latest" ]; then
            echo "✅ Using latest R version: $CURRENT_R_VERSION"
          else
            if [[ "$CURRENT_R_VERSION" == "$TARGET_R_VERSION"* ]]; then
              echo "✅ Correct R version confirmed: $CURRENT_R_VERSION (target: $TARGET_R_VERSION)"
            else
              echo "⚠️  R version mismatch: current=$CURRENT_R_VERSION, target=$TARGET_R_VERSION"
              echo "🔄 Attempting to switch to correct version..."
              bash .scripts/install_dependencies.sh r-manage switch $TARGET_R_VERSION
              R --version | head -1
            fi
          fi
        else
          echo "❌ ERROR: R is not installed or not in PATH"
          exit 1
        fi
        
        # Check cache status
        echo "🔍 Checking cache status..."
        if [ -d "$R_LIBS_USER" ] && [ "$(ls -A $R_LIBS_USER 2>/dev/null)" ]; then
          echo "✅ Cache directory exists with content: $R_LIBS_USER"
          echo "📊 Cache directory size: $(du -sh "$R_LIBS_USER" 2>/dev/null || echo 'Unknown')"
          echo "📁 Cached packages: $(ls "$R_LIBS_USER" | wc -l) packages found"
        else
          echo "⚠️  Cache directory is empty or doesn't exist"
        fi
        
        # Function to check if package is available
        check_package() {
          local pkg="$1"
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (requireNamespace('$pkg', quietly = TRUE)) { cat('$pkg: AVAILABLE\n'); quit(status = 0) } else { cat('$pkg: NOT_AVAILABLE\n'); quit(status = 1) }" 2>/dev/null
          return $?
        }
        
        # Function to install package if not available
        install_if_needed() {
          local pkg="$1"
          if check_package "$pkg"; then
            echo "✅ $pkg is already available, skipping installation"
          else
            echo "📦 Installing $pkg..."
            R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); install.packages('$pkg', repos = 'https://cran.rstudio.com/', lib = '$R_LIBS_USER')"
          fi
        }
        
        # Check and install pak if needed
        echo "🔍 Checking if pak is available..."
        if check_package "pak"; then
          echo "✅ pak is already available"
        else
          echo "📦 Installing pak..."
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); install.packages('pak', repos = 'https://r-lib.github.io/p/pak/stable/', lib = '$R_LIBS_USER')"
        fi
        
        # List of packages to check and install if needed
        # Note: These are script-level variables (not local to any function)
        packages=(
          'devtools'
          'BiocManager' 
          'knitr'
          'rmarkdown'
          'testthat'
          'usethis'
          'yaml'
          'stringr'
          'dplyr'
          'rlist'
        )
        
        echo "🔍 Checking package availability..."
        packages_to_install=()
        
        for pkg in "${packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            echo "❌ $pkg is NOT available, will install"
            packages_to_install+=("$pkg")
          fi
        done
        
        # Install missing packages using pak if any are needed
        if [ ${#packages_to_install[@]} -gt 0 ]; then
          echo "📦 Installing missing packages: ${packages_to_install[*]}"
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); pak::pkg_install(c($(printf "'%s'," "${packages_to_install[@]}" | sed 's/,$//')), ask = FALSE, lib = '$R_LIBS_USER')"
        else
          echo "🎉 All packages are already available! No installation needed."
        fi
        
        # CRITICAL FIX: Install compatible ggplot2 and ggtree versions to prevent check_linewidth error
        echo "🔧 Installing compatible ggplot2 and ggtree versions to prevent check_linewidth error..."
        echo "📦 Installing BiocManager if not available..."
        R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('BiocManager', quietly = TRUE)) { install.packages('BiocManager', lib = '$R_LIBS_USER') }"
        
        # Check R version and apply compatibility fix for R < 4.5
        echo "🔍 Checking R version for ggplot2/ggtree compatibility..."
        R_VERSION=$(R --version | head -1 | grep -o '[0-9]\+\.[0-9]\+' | head -1)
        echo "📊 R version detected: $R_VERSION"
        
        # Install core dependencies first to prevent lazy loading issues
        echo "📦 Installing core dependencies for ggtree..."
        R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); install.packages(c('Rcpp', 'RcppArmadillo', 'ape', 'dplyr', 'tidyr', 'scales', 'rlang', 'cli'), repos = 'https://cran.rstudio.com/', lib = '$R_LIBS_USER')"
        
        # Apply R version-specific ggplot2 installation
        if [ "$(echo "$R_VERSION < 4.5" | bc -l)" -eq 1 ]; then
          echo "🔧 R < 4.5 detected: Installing compatible ggplot2 3.5.x for ggtree compatibility..."
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); install.packages('ggplot2', repos = 'https://cran.rstudio.com/', lib = '$R_LIBS_USER', version = '3.5.1')"
        else
          echo "🔧 R >= 4.5 detected: Installing latest ggplot2 via BiocManager..."
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); BiocManager::install('ggplot2', force=TRUE, ask = FALSE, lib = '$R_LIBS_USER')"
        fi
        
        # Install ggtree with retry logic and dependency resolution
        echo "📦 Installing ggtree via BiocManager with retry logic..."
        for attempt in 1 2 3; do
          echo "Attempt $attempt/3: Installing ggtree..."
          if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); BiocManager::install('ggtree', force=TRUE, ask = FALSE, lib = '$R_LIBS_USER', dependencies = TRUE)"; then
            echo "✅ ggtree installation successful on attempt $attempt"
            break
          else
            echo "❌ ggtree installation failed on attempt $attempt"
            if [ $attempt -eq 3 ]; then
              echo "❌ ERROR: ggtree installation failed after 3 attempts"
              exit 1
            fi
            echo "🔄 Retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        # Additional fix: Install compatible versions to prevent check_linewidth error
        echo "🔧 Installing additional dependencies to prevent check_linewidth error..."
        R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); install.packages(c('scales', 'rlang', 'cli'), repos = 'https://cran.rstudio.com/', lib = '$R_LIBS_USER')"
        
        # Check and install Bioconductor packages if needed
        echo "🔍 Checking Bioconductor packages..."
        # CRITICAL: ggtree must be installed before orthogene since it's a dependency
        bioc_packages=('ggtree' 'GenomicRanges' 'Gviz' 'orthogene')
        bioc_to_install=()
        
        for pkg in "${bioc_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            echo "❌ $pkg is NOT available, will install"
            bioc_to_install+=("$pkg")
          fi
        done
        
        # Install missing Bioconductor packages if any are needed
        if [ ${#bioc_to_install[@]} -gt 0 ]; then
          echo "📦 Installing missing Bioconductor packages: ${bioc_to_install[*]}"
          echo "🔧 Installing Bioconductor packages in order (ggtree first, then orthogene) with force=TRUE..."
          R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); BiocManager::install(c($(printf "'%s'," "${bioc_to_install[@]}" | sed 's/,$//')), force=TRUE, ask = FALSE, lib = '$R_LIBS_USER')"
        else
          echo "🎉 All Bioconductor packages are already available! No installation needed."
        fi
        
        # Verify ggtree installation and loading after Bioconductor installation
        echo "🔍 Verifying ggtree installation after Bioconductor package installation..."
        if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('ggtree', quietly = TRUE)) { cat('ggtree not found\n'); quit(status = 1) } else { cat('ggtree is available\n') }" 2>/dev/null; then
          echo "✅ ggtree package is available"
        else
          echo "❌ ERROR: ggtree package is not available"
          exit 1
        fi
        
        # Verify R packages installation
        echo "🔍 Verifying R packages installation..."
        
        # Check if pak is available
        if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('pak', quietly = TRUE)) { cat('pak not found\n'); quit(status = 1) } else { cat('pak is available\n') }" 2>/dev/null; then
          echo "✅ pak package is available"
        else
          echo "❌ ERROR: pak package is not available"
          exit 1
        fi
        
        # List installed packages
        echo "📋 Installed R packages:"
        R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); installed.packages()[,c('Package', 'Version')]" 2>/dev/null | head -20 || echo "Could not list packages"
        
        # Check all required packages
        echo "🔍 Final verification of all required packages:"
        all_packages=("${packages[@]}" "${bioc_packages[@]}")
        missing_packages=()
        
        for pkg in "${all_packages[@]}"; do
          if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('$pkg', quietly = TRUE)) { cat('$pkg: NOT FOUND\n'); quit(status = 1) } else { cat('$pkg: OK\n') }" 2>/dev/null; then
            echo "✅ $pkg: Available"
          else
            echo "❌ $pkg: Not available"
            missing_packages+=("$pkg")
          fi
        done
        
        # Summary of installation
        echo "📊 INSTALLATION SUMMARY:"
        if [ ${#packages_to_install[@]} -gt 0 ]; then
          echo "  📦 Newly installed packages: ${packages_to_install[*]}"
        fi
        if [ ${#bioc_to_install[@]} -gt 0 ]; then
          echo "  📦 Newly installed Bioconductor packages: ${bioc_to_install[*]}"
        fi
        if [ ${#packages_to_install[@]} -eq 0 ] && [ ${#bioc_to_install[@]} -eq 0 ]; then
          echo "  🎉 No new packages were installed - all were already available"
        fi
        
        # Exit if any packages are still missing
        if [ ${#missing_packages[@]} -gt 0 ]; then
          echo "❌ ERROR: The following packages are still missing: ${missing_packages[*]}"
          exit 1
        fi
        
        # Calculate step duration
        r_deps_end_time=$(date +%s)
        r_deps_duration=$((r_deps_end_time - r_deps_start_time))
        
        echo "📊 Post-R dependencies setup resource status:"
        metrics "POST-R-DEPENDENCIES-SETUP"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  R Dependencies Setup Duration: ${r_deps_duration} seconds"
        echo "  Start Time: $(date -d @$r_deps_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"


  build:
    needs: setup-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        r-version: ['4.4', 'latest']
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs-${{ matrix.r-version }}
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site-${{ matrix.r-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
      
    - name: Restore R packages cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Set up R and system dependencies
      run: |
        # Install system dependencies first
        echo "🚀 Installing system dependencies using centralized script..."
        bash .scripts/install_dependencies.sh system
        bash .scripts/install_dependencies.sh texlive
        bash .scripts/install_dependencies.sh pandoc
        
        # R installation is now handled by r-lib/actions/setup-r action above
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths configured:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Verify R installation and version
        echo "🔍 Verifying R installation and version..."
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed and available"
          R --version | head -1
          echo "🎯 Target R version: ${{ matrix.r-version }}"
          
          # Verify we're using the correct R version
          CURRENT_R_VERSION=$(R --version | head -1 | grep -o '[0-9]\+\.[0-9]\+' | head -1)
          TARGET_R_VERSION="${{ matrix.r-version }}"
          
          if [ "$TARGET_R_VERSION" = "latest" ]; then
            echo "✅ Using latest R version: $CURRENT_R_VERSION"
          else
            if [[ "$CURRENT_R_VERSION" == "$TARGET_R_VERSION"* ]]; then
              echo "✅ Correct R version confirmed: $CURRENT_R_VERSION (target: $TARGET_R_VERSION)"
            else
              echo "⚠️  R version mismatch: current=$CURRENT_R_VERSION, target=$TARGET_R_VERSION"
              echo "🔄 Attempting to switch to correct version..."
              bash .scripts/install_dependencies.sh r-manage switch $TARGET_R_VERSION
              R --version | head -1
            fi
          fi
        else
          echo "❌ ERROR: R is not installed or not in PATH"
          exit 1
        fi
        
        # List all available R versions for debugging
        echo "📋 Available R versions:"
        bash .scripts/install_dependencies.sh r-manage list
        
        # Verify R can access cached packages
        echo "🔍 Verifying cached packages accessibility..."
        if [ -d "$R_LIBS_USER" ] && [ "$(ls -A $R_LIBS_USER 2>/dev/null)" ]; then
          echo "✅ Cached packages found: $(ls "$R_LIBS_USER" | wc -l) packages"
          echo "📋 Available packages:"
          ls "$R_LIBS_USER" | head -10
          
          # Check if devtools is in the cache
          if [ -d "$R_LIBS_USER/devtools" ]; then
            echo "✅ devtools package found in cache"
          else
            echo "⚠️  devtools package NOT found in cache"
          fi
          
          # Set up R library paths to use cached packages
          echo "🔧 Setting up R library paths for cached packages..."
          Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); cat('R library paths configured for cached packages')"
        else
          echo "⚠️  No cached packages found in $R_LIBS_USER"
          echo "📁 Directory contents:"
          ls -la "$R_LIBS_USER" 2>/dev/null || echo "Directory does not exist"
          echo "📁 Directory contents:"
          ls -la "$R_LIBS_USER" 2>/dev/null || echo "Directory does not exist"
        fi


    - name: Comprehensive Build and Documentation (Live Mode - With Commits)
      if: github.ref == 'refs/heads/develop'
      env:
        robqbot_NAME: "robqbot"
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
      run: |
        set -euxo pipefail
        
        # Create debug log file
        DEBUG_LOG="/tmp/build_debug.log"
        echo "=== COMPREHENSIVE BUILD DEBUG LOG ===" > "$DEBUG_LOG"
        echo "Start Time: $(date '+%Y-%m-%d %H:%M:%S')" >> "$DEBUG_LOG"
        echo "GitHub Event: ${{ github.event_name }}" >> "$DEBUG_LOG"
        echo "GitHub Ref: ${{ github.ref }}" >> "$DEBUG_LOG"
        echo "GitHub SHA: ${{ github.sha }}" >> "$DEBUG_LOG"
        echo "=====================================" >> "$DEBUG_LOG"
        
        # Function to log errors with context
        log_error() {
          local step="$1"
          local error_msg="$2"
          echo "❌ ERROR in $step: $error_msg" | tee -a "$DEBUG_LOG"
          echo "Step: $step" >> "$DEBUG_LOG"
          echo "Error: $error_msg" >> "$DEBUG_LOG"
          echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> "$DEBUG_LOG"
          echo "Current directory: $(pwd)" >> "$DEBUG_LOG"
          echo "Environment variables:" >> "$DEBUG_LOG"
          env | grep -E "(R_|GITHUB_)" >> "$DEBUG_LOG" || true
          echo "---" >> "$DEBUG_LOG"
        }
        
        # Function to capture R command output
        run_r_command() {
          local step="$1"
          local r_code="$2"
          echo "🔄 Executing: $step"
          echo "R Code: $r_code" >> "$DEBUG_LOG"
          
          # Set R library paths for this command
          local full_r_code=".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); $r_code"
          
          if Rscript -e "$full_r_code" 2>&1 | tee -a "$DEBUG_LOG"; then
            echo "✅ SUCCESS: $step"
            return 0
          else
            local exit_code=$?
            log_error "$step" "R command failed with exit code $exit_code"
            return $exit_code
          fi
        }
        
        # Configure Git user
        echo "🔧 Configuring Git user..."
        git config --global user.name "${robqbot_NAME}"
        git config --global user.email "${robqbot_EMAIL}"
        
        echo "🚀 Starting comprehensive build and documentation..."
        echo "Build started at: $(date '+%Y-%m-%d %H:%M:%S')" >> "$DEBUG_LOG"
        
        # Set R library paths
        echo "📁 Setting R library paths..."
        export R_LIBS_USER=${{ github.workspace }}/Rlibs
        export R_LIBS_SITE=${{ github.workspace }}/Rlibs-site
        echo "R_LIBS_USER: $R_LIBS_USER" >> "$DEBUG_LOG"
        echo "R_LIBS_SITE: $R_LIBS_SITE" >> "$DEBUG_LOG"
        
        # Verify R library paths are accessible
        if ! run_r_command "Verify R library paths" "cat('R library paths configured successfully')"; then
          log_error "R Library Setup" "Failed to configure R library paths"
          exit 1
        fi
        
        # Check if devtools is already available from cache
        echo "🔍 Checking if devtools is available..."
        if run_r_command "Check devtools" "library(devtools); cat('devtools already available')" 2>/dev/null; then
          echo "✅ devtools is already available from cache"
        else
          echo "📦 Installing devtools (not found in cache)..."
          if ! run_r_command "Install devtools" "install.packages('devtools', repos = 'https://cloud.r-project.org')"; then
            log_error "Devtools Installation" "Failed to install devtools package"
            exit 1
          fi
          
          # Verify devtools is available after installation
          echo "🔍 Verifying devtools installation..."
          if ! run_r_command "Verify devtools" "library(devtools); cat('devtools loaded successfully')"; then
            log_error "Devtools Verification" "devtools package is not available after installation"
            exit 1
          fi
        fi
        
        # CRITICAL FIX: Install compatible ggplot2 and ggtree versions to prevent check_linewidth error
        echo "🔧 Installing compatible ggplot2 and ggtree versions to prevent check_linewidth error..."
        if ! run_r_command "Install BiocManager" "if (!requireNamespace('BiocManager', quietly = TRUE)) { install.packages('BiocManager') }"; then
          log_error "BiocManager Installation" "Failed to install BiocManager"
          exit 1
        fi
        
        # Check R version and apply compatibility fix for R < 4.5
        echo "🔍 Checking R version for ggplot2/ggtree compatibility..."
        R_VERSION=$(R --version | head -1 | grep -o '[0-9]\+\.[0-9]\+' | head -1)
        echo "📊 R version detected: $R_VERSION"
        
        # Install core dependencies first to prevent lazy loading issues
        if ! run_r_command "Install core dependencies" "install.packages(c('Rcpp', 'RcppArmadillo', 'ape', 'dplyr', 'tidyr', 'scales', 'rlang', 'cli'), repos = 'https://cran.rstudio.com/')"; then
          log_error "Core Dependencies Installation" "Failed to install core dependencies"
          exit 1
        fi
        
        # Apply R version-specific ggplot2 installation
        if [ "$(echo "$R_VERSION < 4.5" | bc -l)" -eq 1 ]; then
          echo "🔧 R < 4.5 detected: Installing compatible ggplot2 3.5.x for ggtree compatibility..."
          if ! run_r_command "Install ggplot2 3.5.x" "install.packages('ggplot2', repos = 'https://cran.rstudio.com/', version = '3.5.1')"; then
            log_error "ggplot2 3.5.x Installation" "Failed to install ggplot2 3.5.x"
            exit 1
          fi
        else
          echo "🔧 R >= 4.5 detected: Installing latest ggplot2 via BiocManager..."
          if ! run_r_command "Install ggplot2 via BiocManager" "BiocManager::install('ggplot2', force=TRUE)"; then
            log_error "ggplot2 Installation" "Failed to install ggplot2 via BiocManager"
            exit 1
          fi
        fi
        
        # Install ggtree with retry logic and dependency resolution
        echo "🔧 Installing ggtree with retry logic..."
        for attempt in 1 2 3; do
          echo "Attempt $attempt/3: Installing ggtree..."
          if run_r_command "Install ggtree (attempt $attempt)" "BiocManager::install('ggtree', force=TRUE, dependencies = TRUE)"; then
            echo "✅ ggtree installation successful on attempt $attempt"
            break
          else
            echo "❌ ggtree installation failed on attempt $attempt"
            if [ $attempt -eq 3 ]; then
              log_error "ggtree Installation" "Failed to install ggtree after 3 attempts"
              exit 1
            fi
            echo "🔄 Retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        # Install additional dependencies to prevent check_linewidth error
        if ! run_r_command "Install additional dependencies" "install.packages(c('scales', 'rlang', 'cli'), repos = 'https://cran.rstudio.com/')"; then
          log_error "Additional Dependencies Installation" "Failed to install additional dependencies"
          exit 1
        fi
        
        # Install remaining Bioconductor packages in correct order (ggtree already installed)
        echo "🔧 Installing remaining Bioconductor packages in order (GenomicRanges, Gviz, orthogene)..."
        if ! run_r_command "Install remaining Bioconductor packages" "BiocManager::install(c('GenomicRanges', 'Gviz', 'orthogene'), force=TRUE, ask = FALSE)"; then
          log_error "Bioconductor Installation" "Failed to install remaining Bioconductor packages"
          exit 1
        fi
        
        # Verify ggtree installation
        if ! run_r_command "Verify ggtree" "library(ggtree); cat('ggtree loaded successfully')"; then
          log_error "ggtree Verification" "ggtree package failed to load - check_linewidth error may persist"
          exit 1
        fi
        
        # Install package dependencies
        echo "📦 Installing package dependencies..."
        if ! run_r_command "Install dependencies" "devtools::install_deps(dependencies = TRUE)"; then
          log_error "Dependencies Installation" "Failed to install package dependencies"
          exit 1
        fi
        
        # Build and install the package
        echo "📦 Building and installing SyntenyViz..."
        if ! run_r_command "Package installation" "devtools::install()"; then
          log_error "Package Installation" "Failed to build and install SyntenyViz package"
          exit 1
        fi
        
        # Build package tarball with suppressed warnings
        echo "📦 Building package tarball..."
        # Suppress tar warnings about long paths by setting environment variable
        export R_TAR_CMD="tar --format=ustar"
        # Build with warnings suppressed
        if ! run_r_command "Package tarball build" "suppressWarnings(devtools::build(quiet = TRUE))"; then
          log_error "Package Tarball Build" "Failed to build package tarball"
          exit 1
        fi
        
        # Build documentation
        echo "📖 Building documentation..."
        if ! run_r_command "Documentation build" "devtools::document()"; then
          log_error "Documentation Build" "Failed to build package documentation"
          exit 1
        fi
        
        # Build vignettes with detailed error handling
        echo "📖 Building vignettes..."
        if ! run_r_command "Vignette build" "devtools::build_vignettes()"; then
          echo "❌ ERROR: devtools::build_vignettes() failed. Starting individual vignette check."
          log_error "Vignette Build" "devtools::build_vignettes() failed, starting individual vignette analysis"
          
          # Find and attempt to render each vignette to isolate the failure
          echo "🔍 Analyzing individual vignettes..."
          failed_vignettes=()
          
          for vignette in $(find vignettes -name "*.Rmd"); do
            echo "--- Checking vignette: $vignette ---"
            echo "Checking vignette: $vignette" >> "$DEBUG_LOG"
            
            if ! Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); cat('Attempting to render $vignette...'); rmarkdown::render('$vignette')" 2>&1 | tee -a "$DEBUG_LOG"; then
              echo "❌ FAILURE: Vignette '$vignette' failed to render."
              log_error "Individual Vignette: $vignette" "Vignette rendering failed"
              failed_vignettes+=("$vignette")
              
              echo "📋 Displaying first 100 lines of failing vignette:"
              head -n 100 "$vignette" | tee -a "$DEBUG_LOG"
              
              echo "📋 Vignette file info:"
              ls -la "$vignette" | tee -a "$DEBUG_LOG"
              
              echo "📋 Checking for common vignette issues:"
              echo "YAML header:" | tee -a "$DEBUG_LOG"
              head -n 20 "$vignette" | tee -a "$DEBUG_LOG"
              
              # Check for theme conflicts
              if grep -q 'theme:' "$vignette"; then
                echo "⚠️  WARNING: Found 'theme:' in vignette - potential conflict" | tee -a "$DEBUG_LOG"
                grep -n 'theme:' "$vignette" | tee -a "$DEBUG_LOG"
              fi
              
            else
              echo "✅ SUCCESS: Vignette '$vignette' rendered successfully."
            fi
          done
          
          if [ ${#failed_vignettes[@]} -gt 0 ]; then
            echo "❌ ERROR: The following vignettes failed to render: ${failed_vignettes[*]}"
            log_error "Vignette Analysis" "Multiple vignettes failed: ${failed_vignettes[*]}"
            exit 1
          else
            echo "❌ ERROR: Individual vignette check completed, but the source of the error in devtools::build_vignettes() was not found."
            log_error "Vignette Analysis" "All individual vignettes passed but devtools::build_vignettes() still failed"
            exit 1
          fi
        fi
        
        echo "✅ All vignettes built successfully."
        
        # Clean up Rlibs to minimize package size and warnings (after all devtools operations)
        echo "🧹 Cleaning up Rlibs directory to minimize package size..."
        if [ -d "Rlibs" ]; then
          echo "Removing Rlibs directory from package build to avoid long path warnings"
          rm -rf Rlibs
        fi
        
        echo "Build completed at: $(date '+%Y-%m-%d %H:%M:%S')" >> "$DEBUG_LOG"
        echo "End Time: $(date '+%Y-%m-%d %H:%M:%S')"
        
        echo "✅ Build completed successfully - debug reporting will be handled by separate step"

    - name: Commit R Documentation
      if: github.ref == 'refs/heads/develop'
      env:
        robqbot_NAME: "robqbot"
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        jekyllFolder: docs
      run: |
        set -euxo pipefail
        
        echo "📚 Committing R documentation to repository..."
        echo "Using token: ${robqbot_TOKEN:0:8}... (truncated for security)"
        echo "Using email: $robqbot_EMAIL"
        echo "Using name: $robqbot_NAME"
        echo "Using jekyll folder: $jekyllFolder"
        
        # Execute the R documentation script with dynamic token parameters
        bash .scripts/R_doc.sh \
          --token "$robqbot_TOKEN" \
          --email "$robqbot_EMAIL" \
          --name "$robqbot_NAME" \
          --jekyll-folder "$jekyllFolder" \
          --source-branch "develop"

    - name: Upload R ${{ matrix.r-version }} Package Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: syntenyviz-r${{ matrix.r-version }}-package
        path: |
          SyntenyViz_*.tar.gz
          man/
          vignettes/*.html
          vignettes/*.Rmd
        retention-days: 30
        if-no-files-found: error

    - name: Upload R ${{ matrix.r-version }} Build Logs
      uses: actions/upload-artifact@v4
      with:
        name: syntenyviz-r${{ matrix.r-version }}-logs
        path: |
          /tmp/build_debug.log
          /tmp/debug_summary.txt
        retention-days: 7
        if-no-files-found: warn

    - name: Cache Build Artifacts for Latest R Version
      if: matrix.r-version == 'latest'
      id: cache-save
      uses: actions/cache@v4
      with:
        path: |
          SyntenyViz_*.tar.gz
          man/
          vignettes/
        key: build-artifacts-${{ github.sha }}-rlatest
        restore-keys: |
          build-artifacts-${{ github.ref_name }}-rlatest-
          build-artifacts-rlatest-

    - name: Debug Cache Save Status
      if: matrix.r-version == 'latest'
      run: |
        echo "🔍 Cache save status for R latest version:"
        echo "  Cache hit: ${{ steps.cache-save.outputs.cache-hit }}"
        echo "  Cache key: build-artifacts-${{ github.sha }}-rlatest"
        echo "  Cache saved: ${{ steps.cache-save.outputs.cache-hit != 'true' }}"
        echo ""
        echo "📁 Artifacts being cached:"
        if find . -name "SyntenyViz_*.tar.gz" -type f | head -1; then
          echo "✅ Package tarball: $(find . -name "SyntenyViz_*.tar.gz" -type f | head -1)"
        else
          echo "❌ No package tarball found"
        fi
        
        if [ -d "man" ] && [ "$(ls -A man/ 2>/dev/null)" ]; then
          echo "✅ Man pages: $(ls man/ | wc -l) files"
        else
          echo "❌ No man pages found"
        fi
        
        if [ -d "vignettes" ] && [ "$(ls -A vignettes/ 2>/dev/null)" ]; then
          echo "✅ Vignettes: $(find vignettes -type f | wc -l) files"
        else
          echo "❌ No vignettes found"
        fi

    - name: Debug Analysis and Gist Reporting
      if: always() && github.ref == 'refs/heads/develop'
      env:
        robqbot_EMAIL: ${{ secrets.ROBQBOT_EMAIL }}
        robqbot_NAME: "robqbot"
        robqbot_TOKEN: ${{ secrets.ROBQBOT_DPP4_TOKEN }}
      run: |
        set -euxo pipefail
        
        # Determine build status
        if [ "${{ job.status }}" = "success" ]; then
          BUILD_STATUS="Success"
          GIST_TITLE="SyntenyViz Build Success - Run ${{ github.run_number }}"
          GIST_FILENAME="build-success-${{ github.run_number }}.md"
        else
          BUILD_STATUS="Failure"
          GIST_TITLE="SyntenyViz Build Failure Debug - Run ${{ github.run_number }}"
          GIST_FILENAME="build-failure-debug-${{ github.run_number }}.md"
        fi
        
        # Function to collect comprehensive debug information
        collect_comprehensive_debug() {
          local debug_file="$1"
          local build_status="$2"
          
          {
            echo "# SyntenyViz Build ${build_status} Report"
            echo ""
            echo "**Workflow Run:** ${{ github.run_id }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Triggered by:** ${{ github.actor }}"
            echo "**Timestamp:** $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## Build Summary"
            echo ""
            if [ "$build_status" = "Success" ]; then
              echo "✅ **All build steps completed successfully**"
              echo ""
              echo "- ✅ Dependencies installed"
              echo "- ✅ Package built and installed"
              echo "- ✅ Documentation generated"
              echo "- ✅ All vignettes built successfully"
            else
              echo "❌ **Build encountered errors**"
              echo ""
              echo "The build process failed. Please check the logs for details."
            fi
            echo ""
            
            # Add build debug log if available
            if [ -f "/tmp/build_debug.log" ]; then
              echo "## Build Debug Log"
              echo ""
              echo "\`\`\`"
              cat "/tmp/build_debug.log"
              echo "\`\`\`"
              echo ""
            fi
            
            # Add system information
            echo "## System Information"
            echo ""
            echo "**Hostname:** $(hostname)"
            echo "**OS:** $(uname -a)"
            echo "**Current Directory:** $(pwd)"
            echo "**Disk Usage:**"
            echo "\`\`\`"
            df -h
            echo "\`\`\`"
            echo ""
            
            # Add R environment
            echo "## R Environment"
            echo ""
            if command -v R >/dev/null 2>&1; then
              echo "**R Version:**"
              echo "\`\`\`"
              R --version
              echo "\`\`\`"
            else
              echo "❌ R not found"
            fi
            echo ""
          } > "$debug_file"
        }
        
        # Resource monitoring function for individual steps
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          echo "=========================================="
          echo "📊 RESOURCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')%"
          
          # Memory Performance
          if command -v free >/dev/null 2>&1; then
            local mem_usage=$(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')
            local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f%%", $3/$2 * 100.0; else print "0%"}')
            echo "💾 MEMORY: ${mem_usage} | SWAP: ${swap_usage}"
          fi
          
          # Disk Performance
          echo "💿 DISK: $(df / | tail -1 | awk '{print $5}' || echo 'N/A')"
          
          # Process Performance
          echo "⚡ PROCESSES: $(ps aux | wc -l) total | $(ps aux | grep -v grep | grep -c '^R') running"
          echo "🔝 TOP MEM: $(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          echo "🔝 TOP CPU: $(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3"%"}')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        debug_start_time=$(date +%s)
        
        echo "📊 Pre-comprehensive debug resource status:"
        metrics "PRE-COMPREHENSIVE-DEBUG"
        
        echo "🔍 Running comprehensive debug analysis..."
        
        # Check for build debug log
        if [ -f "/tmp/build_debug.log" ]; then
          echo "📋 BUILD DEBUG LOG FOUND:"
          echo "=========================================="
          cat "/tmp/build_debug.log"
          echo "=========================================="
        else
          echo "⚠️  No build debug log found at /tmp/build_debug.log"
        fi
        
        # Check build artifacts
        echo "📋 Build artifacts analysis:"
        echo "Current directory: $(pwd)"
        echo "Contents:"
        ls -la
        
        # Check if man directory exists and has content
        if [ -d "man" ]; then
          echo "📚 Man directory exists with $(ls man/ | wc -l) files"
          echo "Man files:"
          ls -la man/ | head -10
        else
          echo "❌ Man directory not found"
        fi
        
        # Check vignettes
        if [ -d "vignettes" ]; then
          echo "📖 Vignettes directory exists"
          echo "Vignette files:"
          find vignettes -type f | head -10
          echo "Built vignettes (HTML):"
          find vignettes -name "*.html" | head -10
        else
          echo "❌ Vignettes directory not found"
        fi
        
        # Check for package tarball
        echo "📦 Package tarballs:"
        find . -name "SyntenyViz_*.tar.gz" -type f
        
        # Check R check results
        if [ -d "SyntenyViz.Rcheck" ]; then
          echo "🔍 R check results found:"
          ls -la SyntenyViz.Rcheck/
          if [ -f "SyntenyViz.Rcheck/00check.log" ]; then
            echo "📋 Check log (last 50 lines):"
            tail -50 SyntenyViz.Rcheck/00check.log
          fi
        fi
        
        # Enhanced error analysis
        echo "🔍 ENHANCED ERROR ANALYSIS:"
        echo "=========================================="
        
        # Check R installation and version
        echo "📋 R Installation Status:"
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed"
          R --version | head -3
        else
          echo "❌ R is not installed or not in PATH"
        fi
        
        # Check Rscript availability
        if command -v Rscript >/dev/null 2>&1; then
          echo "✅ Rscript is available"
        else
          echo "❌ Rscript is not available"
        fi
        
        # Check R library paths
        echo "📋 R Library Paths:"
        Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); .libPaths()" 2>/dev/null || echo "❌ Could not get R library paths"
        
        # Check installed packages
        echo "📋 Key R Packages Status:"
        for pkg in devtools BiocManager knitr rmarkdown testthat; do
          if Rscript -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE', .libPaths())); if (requireNamespace('$pkg', quietly = TRUE)) cat('$pkg: OK\n') else cat('$pkg: MISSING\n')" 2>/dev/null; then
            echo "✅ $pkg is available"
          else
            echo "❌ $pkg is missing"
          fi
        done
        
        # Check package DESCRIPTION file
        if [ -f "DESCRIPTION" ]; then
          echo "📋 Package DESCRIPTION:"
          head -20 DESCRIPTION
        else
          echo "❌ DESCRIPTION file not found"
        fi
        
        # Check for common build issues
        echo "📋 Common Build Issue Checks:"
        
        # Check for theme conflicts in vignettes
        echo "🔍 Checking for theme conflicts in vignettes:"
        theme_files=$(find vignettes -name "*.Rmd" -exec grep -l 'theme:' {} \; 2>/dev/null)
        if [ -n "$theme_files" ]; then
          echo "⚠️  Found vignettes with 'theme:' - potential conflicts:"
          echo "$theme_files" | while read -r file; do
            echo "  File: $file"
            grep -n 'theme:' "$file" | head -3
          done
        else
          echo "✅ No theme conflicts found in vignettes"
        fi
        
        # Check for YAML syntax issues in vignettes
        echo "🔍 Checking YAML syntax in vignettes:"
        if [ -d "vignettes" ]; then
          vignette_count=0
          yaml_issues=0
          
          while IFS= read -r -d '' vignette; do
            vignette_count=$((vignette_count + 1))
            if [ -f "$vignette" ]; then
              if ! head -20 "$vignette" 2>/dev/null | grep -q '^---$'; then
                echo "⚠️  Potential YAML issue in $vignette - no opening --- found"
                yaml_issues=$((yaml_issues + 1))
              fi
            else
              echo "⚠️  File not accessible: $vignette"
            fi
          done < <(find vignettes -name "*.Rmd" -print0 2>/dev/null)
          
          echo "📊 YAML check summary: $vignette_count vignettes checked, $yaml_issues potential issues found"
        else
          echo "⚠️  Vignettes directory not found"
        fi
        
        # Check for R syntax issues in vignettes
        echo "🔍 Checking for R syntax issues:"
        if [ -d "vignettes" ]; then
          r_chunks_found=0
          theme_issues=0
          
          while IFS= read -r -d '' vignette; do
            if [ -f "$vignette" ]; then
              if grep -q '```{r' "$vignette" 2>/dev/null; then
                r_chunks_found=$((r_chunks_found + 1))
                echo "📋 Found R chunks in $vignette"
                
                # Extract R code and check for common issues
                if grep -A 20 '```{r' "$vignette" 2>/dev/null | grep -q 'theme('; then
                  echo "⚠️  Found theme() calls in $vignette"
                  theme_issues=$((theme_issues + 1))
                fi
              fi
            else
              echo "⚠️  File not accessible: $vignette"
            fi
          done < <(find vignettes -name "*.Rmd" -print0 2>/dev/null)
          
          echo "📊 R syntax check summary: $r_chunks_found vignettes with R chunks, $theme_issues theme() issues found"
        else
          echo "⚠️  Vignettes directory not found"
        fi
        
        # Run original debug script if it exists
        if [ -f ".scripts/R_debug.sh" ]; then
          echo "🚀 Running original debug script with dynamic token authentication..."
          echo "Using token: ${robqbot_TOKEN:0:8}... (truncated for security)"
          echo "Using email: $robqbot_EMAIL"
          echo "Using name: $robqbot_NAME"
          
          # Execute the R debug script with dynamic token parameters
          bash .scripts/R_debug.sh \
            --token "$robqbot_TOKEN" \
            --email "$robqbot_EMAIL" \
            --name "$robqbot_NAME"
        else
          echo "⚠️  Original debug script not found"
        fi
        
        # Calculate step duration
        debug_end_time=$(date +%s)
        debug_duration=$((debug_end_time - debug_start_time))
        
        echo "📊 Post-comprehensive debug resource status:"
        metrics "POST-COMPREHENSIVE-DEBUG"
        
        # Create comprehensive debug summary
        echo "📋 CREATING COMPREHENSIVE DEBUG SUMMARY:"
        DEBUG_SUMMARY="/tmp/debug_summary.txt"
        {
          echo "=== COMPREHENSIVE DEBUG SUMMARY ==="
          echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "GitHub Event: ${{ github.event_name }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub SHA: ${{ github.sha }}"
          echo "Workflow Run ID: ${{ github.run_id }}"
          echo "====================================="
          echo ""
          echo "BUILD DEBUG LOG:"
          if [ -f "/tmp/build_debug.log" ]; then
            cat "/tmp/build_debug.log"
          else
            echo "No build debug log found"
          fi
          echo ""
          echo "SYSTEM INFORMATION:"
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "Current directory: $(pwd)"
          echo "Disk usage:"
          df -h
          echo ""
          echo "R ENVIRONMENT:"
          if command -v R >/dev/null 2>&1; then
            R --version
          else
            echo "R not found"
          fi
          echo ""
          echo "PACKAGE STATUS:"
          if [ -f "DESCRIPTION" ]; then
            echo "DESCRIPTION file exists"
            head -10 DESCRIPTION
          else
            echo "DESCRIPTION file not found"
          fi
        } > "$DEBUG_SUMMARY"
        
        echo "📋 Debug summary created: $DEBUG_SUMMARY"
        echo "📋 Debug summary size: $(wc -l < "$DEBUG_SUMMARY") lines"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  Comprehensive Debug Duration: ${debug_duration} seconds"
        echo "  Start Time: $(date -d @$debug_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"


