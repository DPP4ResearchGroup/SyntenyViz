name: R-CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  setup-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['latest']
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    env:
      # Use workspace-relative paths for R libraries to ensure they're user-writable
      R_LIBS_USER: ${{ github.workspace }}/Rlibs
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Generate cache key
      id: cache-key
      run: |
        echo "value=r-${{ matrix.r-version }}-packages-$(find . -name "DESCRIPTION" -exec cat {} \; | md5sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Cache R packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: r-${{ matrix.r-version }}-packages-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Install R and Sys deps using centralized script
      run: |
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
          if [ ! -f "$perf_file" ]; then
            echo "step_name,timestamp,cpu_usage,memory_usage,swap_usage,disk_usage,process_count,r_processes,top_mem,top_cpu" > "$perf_file"
          fi
          
          # Capture current metrics
          local cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')
          local mem_usage=$(free | grep Mem | awk '{printf "%.1f", $3/$2 * 100.0}' 2>/dev/null || echo 'N/A')
          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          else
            echo "💿 DISK: Current: N/A | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        r_setup_start_time=$(date +%s)
        
        echo "📊 Pre-R setup resource status:"
        metrics "PRE-R-SETUP"
        
        echo "🚀 Installing R using centralized script..."
        bash .scripts/install_dependencies.sh r ${{ matrix.r-version }}
        
        # Check R version
        echo "📋 R version details:"
        R --version
        
        # Calculate step duration
        r_setup_end_time=$(date +%s)
        r_setup_duration=$((r_setup_end_time - r_setup_start_time))
        
        echo "📊 Post-R setup resource status:"
        metrics "POST-R-SETUP"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  R Setup Duration: ${r_setup_duration} seconds"
        echo "  Start Time: $(date -d @$r_setup_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Set up R dependencies with performance monitoring
      run: |
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
          if [ ! -f "$perf_file" ]; then
            echo "step_name,timestamp,cpu_usage,memory_usage,swap_usage,disk_usage,process_count,r_processes,top_mem,top_cpu" > "$perf_file"
          fi
          
          # Capture current metrics
          local cpu_usage=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1 || echo 'N/A')
          local mem_usage=$(free | grep Mem | awk '{printf "%.1f", $3/$2 * 100.0}' 2>/dev/null || echo 'N/A')
          local swap_usage=$(free | grep Swap | awk '{if($2>0) printf "%.1f", $3/$2 * 100.0; else print "0"}' 2>/dev/null || echo 'N/A')
          local disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//' || echo 'N/A')
          local process_count=$(ps aux | wc -l)
          local r_processes=$(ps aux | grep -v grep | grep -c '^R' || echo '0')
          local top_mem=$(ps -eo pid,comm,%mem --sort=-%mem | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          local top_cpu=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -2 | tail -1 | awk '{print $2 " " $3}' | sed 's/%//' || echo 'N/A')
          
          # Store metrics for averaging
          echo "$step_name,$timestamp,$cpu_usage,$mem_usage,$swap_usage,$disk_usage,$process_count,$r_processes,$top_mem,$top_cpu" >> "$perf_file"
          
          # Calculate averages for this step
          local step_metrics=$(grep "^$step_name," "$perf_file" | tail -5)
          local avg_cpu=$(echo "$step_metrics" | awk -F',' '{sum+=$3; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_mem=$(echo "$step_metrics" | awk -F',' '{sum+=$4; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_swap=$(echo "$step_metrics" | awk -F',' '{sum+=$5; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_disk=$(echo "$step_metrics" | awk -F',' '{sum+=$6; count++} END {if(count>0) printf "%.1f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$7; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          local avg_r_processes=$(echo "$step_metrics" | awk -F',' '{sum+=$8; count++} END {if(count>0) printf "%.0f", sum/count; else print "N/A"}' 2>/dev/null)
          
          echo "=========================================="
          echo "📊 PERFORMANCE METRICS - $step_name"
          echo "⏰ Timestamp: $timestamp"
          echo "=========================================="
          
          # System Information
          echo "🖥️  SYSTEM: $(hostname) | $(uname -a | cut -d' ' -f1-3)"
          echo "⏱️  UPTIME: $(uptime)"
          echo "📊 LOAD: $(cat /proc/loadavg 2>/dev/null || echo 'N/A')"
          
          # CPU Performance (Current + Average)
          echo "🔧 CPU: $(nproc) cores | $(lscpu | grep 'Model name' | cut -d: -f2 | xargs || echo 'N/A')"
          echo "⚡ CPU USAGE: Current: ${cpu_usage}% | Average: ${avg_cpu}%"
          
          # Memory Performance (Current + Average)
          if [ "$mem_usage" != "N/A" ]; then
            echo "💾 MEMORY: Current: ${mem_usage}% | Average: ${avg_mem}%"
          else
            echo "💾 MEMORY: Current: N/A | Average: ${avg_mem}%"
          fi
          
          if [ "$swap_usage" != "N/A" ]; then
            echo "💾 SWAP: Current: ${swap_usage}% | Average: ${avg_swap}%"
          else
            echo "💾 SWAP: Current: N/A | Average: ${avg_swap}%"
          fi
          
          # Disk Performance (Current + Average)
          if [ "$disk_usage" != "N/A" ]; then
            echo "💿 DISK: Current: ${disk_usage}% | Average: ${avg_disk}%"
          else
            echo "💿 DISK: Current: N/A | Average: ${avg_disk}%"
          fi
          
          # Process Performance (Current + Average)
          echo "⚡ PROCESSES: Current: ${process_count} total | Average: ${avg_processes} total"
          echo "⚡ R PROCESSES: Current: ${r_processes} running | Average: ${avg_r_processes} running"
          echo "🔝 TOP MEM: $top_mem%"
          echo "🔝 TOP CPU: $top_cpu%"
          
          # Performance Trends
          echo "📈 PERFORMANCE TRENDS (Last 5 measurements):"
          echo "  CPU: $(echo "$step_metrics" | awk -F',' '{print $3}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Memory: $(echo "$step_metrics" | awk -F',' '{print $4}' | tr '\n' ' ' | sed 's/ $//')"
          echo "  Processes: $(echo "$step_metrics" | awk -F',' '{print $7}' | tr '\n' ' ' | sed 's/ $//')"
          
          echo "=========================================="
        }
        
        # Start timing for this step
        r_deps_start_time=$(date +%s)
        
        echo "📊 Pre-R dependencies setup resource status:"
        metrics "PRE-R-DEPENDENCIES-SETUP"
        
        echo "🚀 Setting up R dependencies with pak..."
        
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Check cache status
        echo "🔍 Checking cache status..."
        if [ -d "$R_LIBS_USER" ] && [ "$(ls -A $R_LIBS_USER 2>/dev/null)" ]; then
          echo "✅ Cache directory exists with content: $R_LIBS_USER"
          echo "📊 Cache directory size: $(du -sh "$R_LIBS_USER" 2>/dev/null || echo 'Unknown')"
          echo "📁 Cached packages: $(ls "$R_LIBS_USER" | wc -l) packages found"
        else
          echo "⚠️  Cache directory is empty or doesn't exist"
        fi
        
        # Function to check if package is available
        check_package() {
          local pkg="$1"
          R -e "
          .libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE'))
          if (requireNamespace('$pkg', quietly = TRUE)) {
            cat('$pkg: AVAILABLE\n')
            quit(status = 0)
          } else {
            cat('$pkg: NOT_AVAILABLE\n')
            quit(status = 1)
          }
          " 2>/dev/null
          return $?
        }
        
        # Function to install package if not available
        install_if_needed() {
          local pkg="$1"
          if check_package "$pkg"; then
            echo "✅ $pkg is already available, skipping installation"
          else
            echo "📦 Installing $pkg..."
            R -e "
            .libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE'))
            install.packages('$pkg', repos = 'https://cran.rstudio.com/', lib = '$R_LIBS_USER')
            "
          fi
        }
        
        # Check and install pak if needed
        echo "🔍 Checking if pak is available..."
        if check_package "pak"; then
          echo "✅ pak is already available"
        else
          echo "📦 Installing pak..."
          R -e "
          .libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE'))
          install.packages('pak', repos = 'https://r-lib.github.io/p/pak/stable/', lib = '$R_LIBS_USER')
          "
        fi
        
        # List of packages to check and install if needed
        # Note: These are script-level variables (not local to any function)
        packages=(
          'devtools'
          'BiocManager' 
          'knitr'
          'rmarkdown'
          'testthat'
          'usethis'
          'yaml'
          'stringr'
          'dplyr'
          'rlist'
        )
        
        echo "🔍 Checking package availability..."
        packages_to_install=()
        
        for pkg in "${packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            echo "❌ $pkg is NOT available, will install"
            packages_to_install+=("$pkg")
          fi
        done
        
        # Install missing packages using pak if any are needed
        if [ ${#packages_to_install[@]} -gt 0 ]; then
          echo "📦 Installing missing packages: ${packages_to_install[*]}"
          R -e "
          .libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE'))
          pak::pkg_install(c($(printf "'%s'," "${packages_to_install[@]}" | sed 's/,$//')), ask = FALSE, lib = '$R_LIBS_USER')
          "
        else
          echo "🎉 All packages are already available! No installation needed."
        fi
        
        # Check and install Bioconductor packages if needed
        echo "🔍 Checking Bioconductor packages..."
        bioc_packages=('GenomicRanges' 'Gviz' 'orthogene')
        bioc_to_install=()
        
        for pkg in "${bioc_packages[@]}"; do
          if check_package "$pkg"; then
            echo "✅ $pkg is already available"
          else
            echo "❌ $pkg is NOT available, will install"
            bioc_to_install+=("$pkg")
          fi
        done
        
        # Install missing Bioconductor packages if any are needed
        if [ ${#bioc_to_install[@]} -gt 0 ]; then
          echo "📦 Installing missing Bioconductor packages: ${bioc_to_install[*]}"
          R -e "
          .libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE'))
          if (!requireNamespace('BiocManager', quietly = TRUE)) {
            install.packages('BiocManager', lib = '$R_LIBS_USER')
          }
          BiocManager::install(c($(printf "'%s'," "${bioc_to_install[@]}" | sed 's/,$//')), ask = FALSE, lib = '$R_LIBS_USER')
          "
        else
          echo "🎉 All Bioconductor packages are already available! No installation needed."
        fi
        
        # Verify R packages installation
        echo "🔍 Verifying R packages installation..."
        
        # Check if pak is available
        if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('pak', quietly = TRUE)) { cat('pak not found\n'); quit(status = 1) } else { cat('pak is available\n') }" 2>/dev/null; then
          echo "✅ pak package is available"
        else
          echo "❌ ERROR: pak package is not available"
          exit 1
        fi
        
        # List installed packages
        echo "📋 Installed R packages:"
        R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); installed.packages()[,c('Package', 'Version')]" 2>/dev/null | head -20 || echo "Could not list packages"
        
        # Check all required packages
        echo "🔍 Final verification of all required packages:"
        all_packages=("${packages[@]}" "${bioc_packages[@]}")
        missing_packages=()
        
        for pkg in "${all_packages[@]}"; do
          if R -e ".libPaths(c('$R_LIBS_USER', '$R_LIBS_SITE')); if (!requireNamespace('$pkg', quietly = TRUE)) { cat('$pkg: NOT FOUND\n'); quit(status = 1) } else { cat('$pkg: OK\n') }" 2>/dev/null; then
            echo "✅ $pkg: Available"
          else
            echo "❌ $pkg: Not available"
            missing_packages+=("$pkg")
          fi
        done
        
        # Summary of installation
        echo "📊 INSTALLATION SUMMARY:"
        if [ ${#packages_to_install[@]} -gt 0 ]; then
          echo "  📦 Newly installed packages: ${packages_to_install[*]}"
        fi
        if [ ${#bioc_to_install[@]} -gt 0 ]; then
          echo "  📦 Newly installed Bioconductor packages: ${bioc_to_install[*]}"
        fi
        if [ ${#packages_to_install[@]} -eq 0 ] && [ ${#bioc_to_install[@]} -eq 0 ]; then
          echo "  🎉 No new packages were installed - all were already available"
        fi
        
        # Exit if any packages are still missing
        if [ ${#missing_packages[@]} -gt 0 ]; then
          echo "❌ ERROR: The following packages are still missing: ${missing_packages[*]}"
          exit 1
        fi
        
        # Calculate step duration
        r_deps_end_time=$(date +%s)
        r_deps_duration=$((r_deps_end_time - r_deps_start_time))
        
        echo "📊 Post-R dependencies setup resource status:"
        metrics "POST-R-DEPENDENCIES-SETUP"
        
        # Step performance summary
        echo "⏱️  STEP PERFORMANCE SUMMARY:"
        echo "  R Dependencies Setup Duration: ${r_deps_duration} seconds"
        echo "  Start Time: $(date -d @$r_deps_start_time '+%Y-%m-%d %H:%M:%S')"
        echo "  End Time: $(date '+%Y-%m-%d %H:%M:%S')"


  build:
    needs: setup-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        r-version: ['latest']
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs
      R_LIBS_SITE: ${{ github.workspace }}/Rlibs-site
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Restore R packages cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.R_LIBS_USER }}
          ${{ env.R_LIBS_SITE }}
        key: ${{ needs.setup-dependencies.outputs.cache-key }}
        restore-keys: |
          r-${{ matrix.r-version }}-packages-

    - name: Set up R (minimal)
      run: |
        # Install R using centralized script
        bash .scripts/install_dependencies.sh r ${{ matrix.r-version }}
        
        # Set up user-writable R library paths
        mkdir -p "$R_LIBS_USER"
        mkdir -p "$R_LIBS_SITE"
        
        echo "📁 R library paths configured:"
        echo "  R_LIBS_USER: $R_LIBS_USER"
        echo "  R_LIBS_SITE: $R_LIBS_SITE"
        
        # Verify R installation
        echo "🔍 Verifying R installation..."
        if command -v R >/dev/null 2>&1; then
          echo "✅ R is installed and available"
          R --version | head -1
        else
          echo "❌ ERROR: R is not installed or not in PATH"
          exit 1
        fi
        
        # Verify R can access cached packages
        echo "🔍 Verifying cached packages accessibility..."
        if [ -d "$R_LIBS_USER" ] && [ "$(ls -A $R_LIBS_USER 2>/dev/null)" ]; then
          echo "✅ Cached packages found: $(ls "$R_LIBS_USER" | wc -l) packages"
          echo "📋 Available packages:"
          ls "$R_LIBS_USER" | head -10
        else
          echo "⚠️  No cached packages found in $R_LIBS_USER"
        fi

    - name: fix SyntenyViz specific system dependencies, TeX Live, and Pandoc
      run: |
        # Resource monitoring function for individual steps with performance tracking
        metrics() {
          local step_name="$1"
          local timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Initialize performance tracking file if it doesn't exist
          local perf_file="/tmp/performance_metrics.txt"
