# Modern Travis CI configuration for Jekyll site
os: linux
dist: jammy

language: ruby
rvm:
  - 3.1

# Cache dependencies for faster builds
cache:
  bundler: true
  directories:
    - vendor/bundle

# Only build on gh-pages branch
branches:
  only:
    - gh-pages

# Build stages for better organization
stages:
  - test
  - deploy

jobs:
  include:
    - stage: test
      script:
        - script/bootstrap
        - script/cibuild
    - stage: deploy
      script: echo "Deploy stage - handled by GitHub Pages"

# Environment variables
env:
  global:
    - JEKYLL_ENV=production

# Addons for additional tools
addons:
  apt:
    packages:
      - libcurl4-openssl-dev
      - libssl-dev
      - zlib1g-dev

# Notifications (optional - uncomment and configure as needed)
# notifications:
#   email:
#     on_success: never
#     on_failure: change
#   slack:
#     secure: "your-slack-webhook-here"

# Skip CI for documentation-only changes
skip_commits:
  message: /^docs?\(.*\):/
