---
# Simplified Travis CI configuration for Jekyll site
os: linux
dist: jammy
language: ruby
rvm: 3.3

# Only build on gh-pages branch
branches:
  only:
    - gh-pages

# Simplified caching
cache:
  bundler: true
  directories:
    - vendor/bundle
    - .sass-cache
    - _site.tar.gz

# Environment variables
env:
  global:
    - JEKYLL_ENV=production
    - BUNDLE_PATH=vendor/bundle
    - BUNDLE_WITHOUT=test
    # Secure environment variables (configured in Travis CI settings)
    - secure: "robqbot_Name"
    - secure: "robqbot_Email" 
    - secure: "robqbot_Token"

# Build stages
stages:
  - test
  - deploy

jobs:
  include:
    - stage: test
      name: "Build and Test"
      script:
        - script/bootstrap
        - script/cibuild
      after_success:
        - echo "Creating build cache for deployment..."
        - rm -f _site.tar.gz 2>/dev/null || true
        - rm -rf _site.tar.gz 2>/dev/null || true
        - tar -czf _site.tar.gz _site/
        - echo "Build cache created: _site.tar.gz"
    - stage: deploy
      name: "Deploy to GitHub Pages"
      script:
        - echo "Checking deployment environment..."
        - |
          if [ -z "${robqbot_Name:-}" ]; then
            echo "❌ robqbot_Name not set. Please configure secure environment variables in Travis CI settings."
            exit 1
          fi
        - |
          if [ -z "${robqbot_Email:-}" ]; then
            echo "❌ robqbot_Email not set. Please configure secure environment variables in Travis CI settings."
            exit 1
          fi
        - |
          if [ -z "${robqbot_Token:-}" ]; then
            echo "❌ robqbot_Token not set. Please configure secure environment variables in Travis CI settings."
            exit 1
          fi
        - echo "✅ All required environment variables are set"
        - script/bootstrap
        - script/cibuild
        - script/deploy

# Cache validation and cleanup to prevent corruption
before_install:
  - |
    echo "Validating cache integrity..."
    # Check for corrupted cache entries that could cause issues
    if [ -d "Gemfile.lock" ]; then
      echo "❌ CRITICAL: Gemfile.lock is a directory in cache!"
      echo "This will cause EISDIR errors. Removing immediately..."
      rm -rf Gemfile.lock
      echo "Removed corrupted Gemfile.lock directory from cache"
    fi
    # Check for _site.tar.gz directory issue
    if [ -d "_site.tar.gz" ]; then
      echo "❌ CRITICAL: _site.tar.gz is a directory in cache!"
      echo "This will cause tar errors. Removing immediately..."
      rm -rf _site.tar.gz
      echo "Removed corrupted _site.tar.gz directory from cache"
    fi
    # Clean up any empty or corrupted cache directories
    find . -name "*.lock" -type d -delete 2>/dev/null || true
    find . -name "Gemfile.lock*" -size 0 -delete 2>/dev/null || true
    find . -name "*.tar.gz" -type d -delete 2>/dev/null || true
    echo "Cache validation completed"

# Install dependencies
install:
  - script/bootstrap

# Before script
before_script:
  - echo "Starting CI build process..."
  - echo "Ruby version=$(ruby --version)"
  - echo "Bundler version=$(bundle --version)"

# After script cleanup
after_script:
  - echo "CI build process completed"
  - echo "Cleaning up cache to prevent corruption..."
  - find . -name "*.lock" -type d -delete 2>/dev/null || true
  - find . -name "Gemfile.lock*" -size 0 -delete 2>/dev/null || true
  - find . -name "*.tar.gz" -type d -delete 2>/dev/null || true
  - rm -rf .bundle/config 2>/dev/null || true
  - rm -rf vendor/bundle/.bundle 2>/dev/null || true
  - rm -rf .jekyll-cache 2>/dev/null || true
  - echo "Cache cleanup completed"

# Notifications
notifications:
  email:
    on_success: never
    on_failure: change