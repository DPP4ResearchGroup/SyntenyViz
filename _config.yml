# Site Configuration
title: SyntenyViz
description: A synteny visualization R package for comparative genomics
author: DPP4ResearchGroup
email: opensource+jekyll-theme-architect@github.com
url: "https://dpp4researchgroup.github.io"
baseurl: "/SyntenyViz"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: UTC
encoding: utf-8

# Theme and plugins
remote_theme: pages-themes/architect
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# SEO and social
show_downloads: true
google_analytics: G-XXXXXXXXXX  # Replace with your GA4 measurement ID
twitter:
  username: dpp4researchgroup
github:
  username: DPP4ResearchGroup
  repository: SyntenyViz

# Site variables
github:
  pdf_url: https://github.com/DPP4ResearchGroup/SyntenyViz/raw/gh-pages/jekyll_collection/SyntenyViz_workflow.pdf
  tar_url: https://github.com/DPP4ResearchGroup/SyntenyViz/archive/v0.0.0.9000-prerelease.tar.gz

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md
  - package.json
  - package-lock.json
  - .travis.yml
  - .gitignore
  - secrets.txt

# Include files that are normally excluded
include:
  - _pages
  - _posts
  - _drafts

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "DPP4ResearchGroup"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "DPP4ResearchGroup"
