# Site Configuration
title: SyntenyViz
description: A synteny visualization R package for comparative genomics
author: DPP4ResearchGroup
email: opensource+jekyll-theme-architect@github.com
url: "https://dpp4researchgroup.github.io"
baseurl: "/SyntenyViz"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: UTC
encoding: utf-8

# Theme and plugins
remote_theme: pages-themes/architect
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# SEO and social
show_downloads: true
google_analytics: G-BB6PSVP76C
twitter:
  username: dpp4researchgroup
github:
  username: DPP4ResearchGroup
  repository: SyntenyViz

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md
  - package.json
  - package-lock.json
  - .travis.yml
  - .gitignore
  - secrets.txt
