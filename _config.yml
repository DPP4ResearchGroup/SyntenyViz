# Site Configuration
title: SyntenyViz
description: A synteny visualization R package for comparative genomics
author: DPP4ResearchGroup
email: opensource+jekyll-theme-midnight@github.com
url: "https://dpp4researchgroup.github.io"
baseurl: "/SyntenyViz"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: UTC+9.5
encoding: utf-8

# Include directories for Jekyll build
include:
  - _includes
  - _layouts
  - _sass
  - assets

# Jekyll build configuration
keep_files:
  - _includes
  - _layouts
  - _sass
  - assets

# Collections for custom content
collections:
  includes:
    output: false
  layouts:
    output: false

# Theme and plugins
remote_theme: pages-themes/midnight
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Jekyll processing options
safe: false
lsi: false
incremental: false

# SEO and social
show_downloads: true

# Download configuration - uses GitHub API for latest release
use_latest_release: true
release_assets:
  - name: "SyntenyViz Package"
    pattern: "*.tar.gz"
  - name: "Source Code"
    pattern: "*.zip"
google_analytics: G-BB6PSVP76C
twitter:
  username: robqiao
github:
  username: DPP4ResearchGroup
  repository: SyntenyViz
  latest_release: true

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md
  - package.json
  - package-lock.json
  - .travis.yml
  - .gitignore
  - secrets.txt
