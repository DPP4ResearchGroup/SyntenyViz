# Site Configuration
title: SyntenyViz
description: A synteny visualization R package for comparative genomics
author: DPP4ResearchGroup
email: opensource+jekyll-theme-midnight@github.com
url: "https://dpp4researchgroup.github.io"
baseurl: "/SyntenyViz"

# Project maintainer information
maintained: true
maintainer: DPP4ResearchGroup
maintainer_url: "https://github.com/DPP4ResearchGroup"

# Project metadata
version: "0.0.0.9000"
license: "MIT"
repository: "DPP4ResearchGroup/SyntenyViz"
homepage: "https://dpp4researchgroup.github.io/SyntenyViz/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: UTC+9.5
encoding: utf-8

# Include directories for Jekyll build
include:
  - _includes
  - _sass
  - assets

# Theme and plugins
remote_theme: pages-themes/midnight
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# GitHub Pages specific settings
github: [metadata]

# GitHub user information
github:
  username: DPP4ResearchGroup
  repository: SyntenyViz
  repository_url: https://github.com/DPP4ResearchGroup/SyntenyViz
  is_project_page: true
  latest_release: true

# Jekyll processing options
safe: false
lsi: false
incremental: false

# SEO and Analytics
seo:
  type: "WebSite"
  name: "SyntenyViz"
  description: "A synteny visualization R package for comparative genomics"
  url: "https://dpp4researchgroup.github.io/SyntenyViz/"
  image: "https://dpp4researchgroup.github.io/SyntenyViz/assets/images/SynViz.png"

# SEO and social
show_downloads: true

# Download configuration - uses GitHub API for latest release
use_latest_release: true
release_assets:
  - name: "SyntenyViz Package"
    pattern: "*.tar.gz"
  - name: "Source Code"
    pattern: "*.zip"

# GitHub API for latest release metadata is enabled above
# Google Analytics 4 (GA4) configuration
google_analytics: G-BB6PSVP76C

# Analytics debugging (set to false in production)
analytics_debug: false
twitter:
  username: robqiao

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md
  - package.json
  - package-lock.json
  - .travis.yml
  - .gitignore
  - secrets.txt
